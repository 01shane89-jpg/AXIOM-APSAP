# OSAP on Netlify, behind the paywall (tools/tiers.mjs). GitHub Pages keeps serving the data the Actions jobs refresh;
# this site serves the app and passes every data request through the gate (netlify/edge-functions/osap-data.js).
[build]
  command = "node tools/netlify_build.mjs && npm ci --prefix netlify --no-audit --no-fund"
  publish = "_site"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  # batch the builds: production builds only when the site itself changed, at most once per 8-hour block (00, 08, 16 UTC),
  # because each production deploy costs 15 credits. "[deploy now]" in a PR title deploys at once. See tools/netlify_ignore.mjs.
  ignore = "node tools/netlify_ignore.mjs"

# Free data, after the gate let it through: straight from GitHub Pages
[[redirects]]
  from = "/data/*"
  to = "https://01shane89-jpg.github.io/AXIOM-APSAP/data/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/source/*"
  to = "https://01shane89-jpg.github.io/AXIOM-APSAP/source/:splat"
  status = 200
  force = true

# Basic browser protections on every response (16 Nov 2026 quality check: the site sent only HSTS). SAMEORIGIN keeps other
# sites from framing a signed-in OSAP to trick taps (its own scan frames are same-origin; the desktop app and Android app load
# it top-level); the referrer policy sends outside hosts only the origin, never the path. Not here yet: nosniff (the data gate
# answers locked <script> files as text/plain, which nosniff would turn into console errors) and a Content-Security-Policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Android app link (android/README.md): Android checks this file to open the Play Store app full screen, without a browser bar
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# "Ask about this country" checks each answer against its sources with the machine translation guard's fact checks
# (tools/ground.mjs -> tools/mt_guard.mjs), which read the Thai place list once at load; the function carries that file.
[functions."osap-ask"]
  included_files = ["tools/mt/th_places.json"]
