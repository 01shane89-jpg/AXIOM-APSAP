# OSAP on Netlify, behind the paywall (tools/tiers.mjs). GitHub Pages keeps serving the data the Actions jobs refresh;
# this site serves the app and passes every data request through the gate (netlify/edge-functions/osap-data.js).
[build]
  command = "node tools/netlify_build.mjs && npm ci --prefix netlify --no-audit --no-fund"
  publish = "_site"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  # batch the builds: production builds only when the site itself changed, at most once per 8-hour block (00, 08, 16 UTC),
  # because each production deploy costs 15 credits. "[deploy now]" in a PR title deploys at once. See tools/netlify_ignore.mjs.
  ignore = "node tools/netlify_ignore.mjs"

# Free data, after the gate let it through: straight from GitHub Pages
[[redirects]]
  from = "/data/*"
  to = "https://01shane89-jpg.github.io/AXIOM-APSAP/data/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/source/*"
  to = "https://01shane89-jpg.github.io/AXIOM-APSAP/source/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
