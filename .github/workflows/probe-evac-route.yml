# Test only: checks the router options the evacuation route uses (tools/probe_evac_route.mjs). Prints to the log.
name: Probe evacuation route
on:
  push:
    branches: [claude/embassies-evac, claude/evac-route]
    paths: [tools/probe_evac_route.mjs, .github/workflows/probe-evac-route.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/probe_evac_route.mjs
