# Test only: searches YouTube's public channel search for the broadcasters in tools/youtube_candidates.json and prints
# each channel's owner, subscribers and latest upload. Writes nothing to the repo.
name: Probe YouTube channels
on:
  push:
    branches: [claude/youtube-channels]
    paths: [tools/youtube_candidates.json, tools/probe_youtube.mjs, .github/workflows/probe-youtube.yml]
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated area ids to probe; empty probes all"
        required: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node tools/probe_youtube.mjs
        env:
          ONLY: ${{ inputs.only }}
