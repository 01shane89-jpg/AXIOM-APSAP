name: probe-unroca
on:
  push:
    branches: [claude/milref-unroca]
    paths: [.github/workflows/probe-unroca.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (OSAP research probe)'
          curl -sSL -m 30 -A "$UA" -o app.js 'https://www.unroca.org/static/unroca_spa/public/unroca-javascript.min.js?v=2018-12'
          wc -c app.js
          echo "=== url-ish strings"
          grep -oE '"[^" ]*/[^" ]*"|'"'"'[^'"' "']*/[^'"' "']*'"'" app.js | sort -u | head -150
          echo "=== http calls"
          grep -oE '\$http[.a-z]*\([^)]{0,160}' app.js | head -60
