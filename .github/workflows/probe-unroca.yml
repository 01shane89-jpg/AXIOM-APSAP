name: probe-unroca
on:
  push:
    branches: [claude/milref-unroca]
    paths: [.github/workflows/probe-unroca.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (OSAP research probe)'
          curl -sSL -m 30 -A "$UA" -o app.js 'https://www.unroca.org/static/unroca_spa/public/unroca-javascript.min.js?v=2018-12'
          for k in '_1"' '"_2' 'own_values' 'reported by' 'Reported by' 'milhold' 'contains_classified' 'tp_slug='; do echo "=== ctx $k"; grep -oE ".{0,250}$k.{0,250}" app.js | head -3; done
          for t in hw-comptable-template modal-template-for-comptable country-profile; do echo "=== TPL $t"; curl -sS -m 30 -A "$UA" https://www.unroca.org/static/unroca_spa/templates/$t.html | grep -iE 'report|_1|_2|own|other|holding|classified' | sed 's/^ *//' | head -25; done
          curl -sS -m 30 -A "$UA" -o de.json https://www.unroca.org/api/germany/
          node -e '
          const d=JSON.parse(require("fs").readFileSync("de.json"));
          console.log("milhold", JSON.stringify(d.milhold.map(m=>({t:m.tow_acronym,v:m.values.filter(x=>x.has_reported||x.amount!=null).slice(-3)}))));
          console.log("impdom", JSON.stringify(d.hw_imp_vs_hw_dom));
          console.log("n imp", d.hw_imp.length, "n exp", d.hw_exp.length, "salw imp", d.salw_imp.length);
          console.log("keys", Object.keys(d.hw_exp[0]).sort().join(","));
          '
