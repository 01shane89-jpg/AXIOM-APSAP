# Probe only (branch claude/device-sync-probe, never merged): which public relays take OSAP sync events
name: Relay probe
on:
  push:
    branches: [claude/device-sync-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/probe/relay_probe.mjs
