name: Refresh outlet facts

# Once a month (tools/refresh_outlet_facts.mjs): who owns each news outlet OSAP reads, its parent company, how it is paid for, where it
# is based and any political ideology its record states, from Wikidata (CC0, keyless, no account), into data/outlet-facts.js for
# "About this outlet" in Go deeper and Story coverage. A run on any branch other than main parks its output on
# claude/outlet-facts-preview-data instead of committing.
on:
  schedule:
    - cron: "41 4 7 * *"
  push:
    branches: [claude/outlet-facts*]
    paths: [tools/refresh_outlet_facts.mjs, tools/outlet_facts_lib.mjs, .github/workflows/refresh-outlet-facts.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-outlet-facts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Read the outlets' Wikidata records
        timeout-minutes: 35
        run: node tools/refresh_outlet_facts.mjs
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan outlet-facts-preview-data
          git rm -rqf --cached .
          git add -f data/outlet-facts.js
          git commit -qm "Test output (outlet facts) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/outlet-facts-preview-data
      - name: Commit if the facts changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git add -N data/outlet-facts.js
          if git diff --quiet data/outlet-facts.js; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outlet-facts.js
          git commit -m "Refresh outlet facts $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 10)); done
          exit 1
