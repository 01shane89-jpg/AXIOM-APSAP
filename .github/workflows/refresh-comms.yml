# Measured mobile coverage for the Comms tab (tools/build_comms_coverage.py): the two newest quarters of Ookla Open Data
# mobile tiles (public S3 bucket, no account or key; CC BY-NC-SA 4.0, non-commercial) folded into data/comms/cov.
# Ookla publishes a quarter a few weeks after it ends, so the job looks once a month and commits only when a new quarter
# has appeared. It commits on main only; a run on any other branch builds and reports without committing.
name: Refresh measured mobile coverage

on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the quarters have not changed"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: refresh-comms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Find the two newest quarters
        id: q
        run: |
          B=https://ookla-open-data.s3.amazonaws.com
          keys=$(for y in $(date -u +%Y) $(( $(date -u +%Y) - 1 )); do
            curl -sf "$B/?list-type=2&prefix=parquet/performance/type=mobile/year=$y/" | grep -o '<Key>[^<]*_performance_mobile_tiles.parquet</Key>' | sed 's/<[^>]*>//g'
          done | sort | tail -2)
          [ "$(echo "$keys" | wc -l)" = 2 ] || { echo "could not list the bucket"; exit 1; }
          args=""; periods=""
          for k in $keys; do
            p=$(echo "$k" | sed -E 's/.*year=([0-9]+)\/quarter=([0-9]).*/\1-Q\2/')
            args="$args $p=/tmp/$p.parquet"; periods="$periods\"$p\","
            echo "$p $B/$k"
          done
          echo "$keys" > /tmp/keys.txt
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "periods=[${periods%,}]" >> "$GITHUB_OUTPUT"
      - name: Build when a new quarter is out
        run: |
          have=$(python3 -c 'import json;print(json.dumps(json.load(open("data/comms/cov/index.json"))["periods"],separators=(",",":")))' 2>/dev/null || echo none)
          echo "have $have, newest ${{ steps.q.outputs.periods }}"
          if [ "$have" = '${{ steps.q.outputs.periods }}' ] && [ "${{ inputs.force }}" != "true" ]; then echo "up to date"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          python -m pip install --quiet pyarrow
          for k in $(cat /tmp/keys.txt); do
            p=$(echo "$k" | sed -E 's/.*year=([0-9]+)\/quarter=([0-9]).*/\1-Q\2/')
            curl -sfL -o "/tmp/$p.parquet" "https://ookla-open-data.s3.amazonaws.com/$k"
          done
          python tools/build_comms_coverage.py data/comms/cov ${{ steps.q.outputs.args }}
          du -sh data/comms/cov
      - name: Commit on main
        if: ${{ github.ref == 'refs/heads/main' && env.SKIP != '1' }}
        run: |
          git add -A data/comms/cov
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh measured mobile coverage $(date -u +'%Y-%m-%d')"
          git checkout -- .
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 7; done
          exit 1
