# Test only: checks the keyless imagery hosts for the Newest imagery picker (tools/probe_newest_imagery.mjs). Writes nothing.
name: Probe newest imagery
on:
  push:
    branches: [claude/newest-imagery]
    paths: [tools/probe_newest_imagery.mjs, .github/workflows/probe-newest-imagery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/probe_newest_imagery.mjs
