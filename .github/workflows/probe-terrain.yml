# Test only: runs Terrain analysis in a headless browser on real elevation tiles (Terrain Tiles on AWS, GSI Japan) at a few
# places (tools/terrain_live.mjs). Prints to the log; writes nothing to the repo.
name: Probe terrain analysis
on:
  push:
    branches: [claude/terrain-viewshed, claude/terrain-los]
    paths: [tools/terrain_live.mjs, assets/osap-terrain.js, "assets/terrain/**", .github/workflows/probe-terrain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p terrain-out && OUT=terrain-out node tools/terrain_live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: terrain-live
          path: terrain-out
          retention-days: 7
