# Hospital website evidence (data/hospitals/<cc>/web.json): re-checks every quote against the stricter rules in
# tools/build_hospital_web.mjs and adds an English machine translation beside each Thai quote, the original kept.
# Translation runs on the job's own CPU with the MADLAD-400 model the 15-minute refresh keeps in the Actions cache (no key,
# no account); if the cache is empty, a few quotes go to MyMemory's free service and the rest wait for the next run.
# Nothing is fetched from hospital sites here. It commits web.json on the branch it runs on.
name: Hospital website evidence check and translation

on:
  push:
    branches: ["claude/medplan-web-*"]
    paths: ["tools/build_hospital_web.mjs", ".github/workflows/hospital-web-translate.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hospital-web-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Restore the translation model
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/osap-mt
          key: madlad400-3b-mt-ct2-int8-v1
      - name: Install the translation runtime
        run: python -m pip install --quiet "ctranslate2>=4,<5" sentencepiece
        continue-on-error: true
      - name: Check and translate
        env:
          MT_LIMIT: "400"
          MT_BUDGET: "600"
          MYMEMORY_LIMIT: "40"
        run: |
          for f in data/hospitals/*/web.json; do
            for pass in 1 2 3; do node tools/build_hospital_web.mjs --update "$f"; done
          done
        timeout-minutes: 40
      - name: Commit
        run: |
          git add -A data/hospitals/*/web.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Hospital website evidence: stricter check and English translations $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
