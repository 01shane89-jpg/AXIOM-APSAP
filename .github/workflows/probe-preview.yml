# Test only: checks the keyless street-level imagery and imagery-date hosts Route Preview calls from the browser
# (tools/probe_preview.sh). Prints to the log; writes nothing to the repo.
name: Probe route preview hosts
on:
  push:
    branches: [claude/route-preview]
    paths: [tools/probe_preview.sh, .github/workflows/probe-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_preview.sh
