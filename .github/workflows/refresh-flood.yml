name: Refresh live snapshots

# Hourly: pull ThaiWater gauges and rain, USGS earthquakes and Open-Meteo air quality, and commit
# the new snapshots, so the hosted app shows data at most about an hour old even where the browser
# cannot reach those services. One feed failing does not stop the others.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-flood
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull ThaiWater feeds
        run: node tools/refresh_flood.mjs
        continue-on-error: true
      - name: Pull USGS earthquakes and air quality
        run: node tools/refresh_feeds.mjs
        continue-on-error: true
      - name: Commit if a snapshot changed
        run: |
          if git diff --quiet data/thailand/flood-live-snapshot.js data/live; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thailand/flood-live-snapshot.js data/live
          git commit -m "Refresh live snapshots $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
