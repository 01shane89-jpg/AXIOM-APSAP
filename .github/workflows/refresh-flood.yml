name: Refresh live snapshots

# Every 15 minutes: pull ThaiWater gauges and rain, USGS earthquakes, Open-Meteo air quality, GDACS alerts,
# ReliefWeb reports, official weather warnings, local news and official social media accounts
# (non-English text translated to English), and commit
# the new snapshots, so the hosted app shows data at most about 15 minutes old (plus the sources' own delay) even where the browser
# cannot reach those services. One feed failing does not stop the others.
run-name: ${{ inputs.lane && format('Refresh live snapshots ({0})', inputs.lane) || 'Refresh live snapshots' }}
on:
  schedule:
    # Off the hour and quarter-hour, when GitHub delays scheduled runs most. Free while the repository is public.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one step only (flood, feeds, warnings, news, topics, et, health-test, deepsouth, social, more, storms, roads, dense, evsum, push, push-test, probe-models, probe, probe-roads, probe-dense, probe-news, probe-cap, probe-deepsouth, probe-placement, probe-refdata, probe-leads, probe-et); empty runs all"
        required: false
        default: ""
      lane:
        description: "fast (weather, hazards and the other quick feeds) or news (news, data sets, Deep South, social, summaries); empty runs both"
        required: false
        default: ""

permissions:
  contents: write

# One queue per branch and lane: runs of the same lane never overlap, test runs on feature branches (which never commit) neither
# wait for nor replace main's, and the fast lane never waits behind the slower news lane. The keeper starts both lanes every
# 15 minutes; a full run takes about 25 minutes, so with one queue fresh data landed only about every 25 to 30 minutes.
concurrency:
  group: refresh-flood-${{ github.ref }}-${{ inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full run takes about 25 minutes (news ~8, social ~6, warnings ~3). At 30 the job was cancelled before "Commit if a snapshot
    # changed", so nothing was saved. Each pull step has its own time limit (about 1.5x its slowest run on 2026-10-03), so one stuck
    # feed is cut off and the run still commits everything else: on 2026-10-03 the news step hung for 50 minutes and nothing was saved.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Translation runs on the job's own CPU with Google's open MADLAD-400 model (tools/mt/madlad.py, Apache-2.0): no key,
      # no quota. The converted model (about 3 GB) is kept in the Actions cache, so the conversion only runs when that is empty.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ !inputs.only || inputs.only == 'warnings' || inputs.only == 'news' || inputs.only == 'deepsouth' || inputs.only == 'social' }}
        with:
          python-version: "3.11"
      - name: Restore the translation model
        id: mt-cache
        if: ${{ !inputs.only || inputs.only == 'warnings' || inputs.only == 'news' || inputs.only == 'deepsouth' || inputs.only == 'social' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/osap-mt
          key: madlad400-3b-mt-ct2-int8-v1
      - name: Install the translation runtime
        if: ${{ !inputs.only || inputs.only == 'warnings' || inputs.only == 'news' || inputs.only == 'deepsouth' || inputs.only == 'social' }}
        run: python -m pip install --quiet "ctranslate2>=4,<5" sentencepiece
        continue-on-error: true
      - name: Convert the translation model (only when the cache is empty)
        if: ${{ (!inputs.only || inputs.only == 'warnings' || inputs.only == 'news' || inputs.only == 'social') && steps.mt-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/hf && sudo chown "$USER" /mnt/hf && export HF_HOME=/mnt/hf
          # the source weights are one 11.7 GB float32 file: add swap so the runner can map it
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          sudo sysctl -q vm.overcommit_memory=1
          df -h / /mnt | tail -2; free -g
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "transformers>=4.40,<5" huggingface_hub protobuf sentencepiece
          python tools/mt/setup_madlad.py
          rm -rf /mnt/hf
        continue-on-error: true
      - name: Pull ThaiWater feeds
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'flood' }}
        timeout-minutes: 4
        run: node tools/refresh_flood.mjs
        continue-on-error: true
      - name: Pull USGS earthquakes, air quality, GDACS alerts and ReliefWeb reports
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'feeds' }}
        timeout-minutes: 4
        run: node tools/refresh_feeds.mjs
        continue-on-error: true
      - name: Pull official weather warnings and translate them
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'warnings' }}
        timeout-minutes: 10
        run: node tools/refresh_warnings.mjs
        continue-on-error: true
      - name: Pull local news (GDELT and national outlets) and translate headlines
        if: ${{ (!inputs.only && inputs.lane != 'fast') || inputs.only == 'news' }}
        timeout-minutes: 14
        run: node tools/refresh_news.mjs
        continue-on-error: true
      # Data sets (tools/topics.json): each one's news searches, then the one search index over every country's news and those
      # results (data/live/news-index.js and data/live/news-index/<day>.js), which the app's news search reads.
      - name: Pull data-set searches and build the news search index
        if: ${{ (!inputs.only && inputs.lane != 'fast') || inputs.only == 'news' || inputs.only == 'topics' || inputs.only == 'et' }}
        timeout-minutes: 5
        run: node tools/refresh_topics.mjs; node tools/news_index.mjs; node tools/refresh_layerfeed.mjs
        continue-on-error: true
      # The ET tab (UFO and UAP reports): the news pool's "uap" data set pinned on the map, official releases and the
      # notable cases in tools/et_cases.json, into data/live/et.js (tools/refresh_et.mjs).
      - name: Build the ET tab's data
        if: ${{ (!inputs.only && inputs.lane != 'fast') || inputs.only == 'news' || inputs.only == 'topics' || inputs.only == 'et' }}
        timeout-minutes: 6
        run: node tools/refresh_et.mjs
        continue-on-error: true
      # Thailand's Deep South (insurgency layer only): Deep South outlets and searches, the news step's Deep South items, and UCDP's
      # Patani-conflict events for the past 13 months. Runs after the news step because it reads data/live/news.js.
      - name: Pull Deep South insurgency reporting and translate Thai headlines
        if: ${{ (!inputs.only && inputs.lane != 'fast') || inputs.only == 'deepsouth' }}
        timeout-minutes: 9
        run: node tools/refresh_deepsouth.mjs
        continue-on-error: true
      # The conflict tabs and their extras run hourly in their own workflow (refresh-conflicts.yml), so this one stays short.
      - name: Probe the Deep South feeds (diagnostic, writes probe-out/ only)
        if: ${{ inputs.only == 'probe-deepsouth' }}
        run: PROBE=1 node tools/refresh_deepsouth.mjs; node tools/probe_dsources.mjs
        continue-on-error: true
      - name: Keep the Deep South probe output as a run artifact
        if: ${{ always() && (inputs.only == 'probe-deepsouth' || inputs.only == 'deepsouth') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-deepsouth
          path: |
            probe-out/
            data/live/deepsouth.js
          if-no-files-found: ignore
          retention-days: 3
      # The social pull reads its accounts several at a time and stops starting new YouTube channels after 6 minutes
      # (tools/refresh_social.mjs); accounts it misses keep their earlier posts. A full run still repeats it only when the
      # last social snapshot is 40 minutes old or more. Running "social" on its own always pulls.
      - name: Pull official and established social media accounts
        if: ${{ (!inputs.only && inputs.lane != 'fast') || inputs.only == 'social' }}
        timeout-minutes: 11
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$ONLY" ] && node -e 'const m=/"asof":"([^"]+)"/.exec(require("fs").readFileSync("data/live/social.js","utf8"));const t=m&&Date.parse(m[1].replace(" ","T"));process.exit(t&&Date.now()-t<40*60e3?0:1)' 2>/dev/null; then
            echo "Social snapshot is under 40 minutes old; skipping this cycle"; exit 0
          fi
          node tools/refresh_social.mjs
        continue-on-error: true
      - name: Pull advisories, tsunami, volcano, outbreak, outage, maritime, sanctions and displacement feeds
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'more' }}
        timeout-minutes: 7
        run: node tools/refresh_more.mjs
        continue-on-error: true
      - name: Pull road closures and road events from open road-agency feeds (NZ, France, Western Australia, British Columbia, Finland)
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'roads' }}
        timeout-minutes: 4
        run: node tools/refresh_roads.mjs
        continue-on-error: true
      - name: Pull tropical cyclone positions and forecast tracks (JMA, JTWC, GDACS) and the weather forecast
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'storms' }}
        timeout-minutes: 4
        run: node tools/refresh_storms.mjs
        continue-on-error: true
      # Every other free, no-login feed (tools/refresh_dense.mjs): writes data/live/x/feeds.js and one file per country.
      - name: Pull the dense open-data feeds (hazards, aviation, cyber, sanctions, travel advice, health, economy, elections)
        if: ${{ (!inputs.only && inputs.lane != 'news') || inputs.only == 'dense' }}
        run: |
          npm install --no-save --no-audit --no-fund h3-js@4 >/dev/null 2>&1 || true
          SAMPLES=${{ inputs.only == 'dense' && '1' || '' }} node tools/refresh_dense.mjs
        timeout-minutes: 14
        continue-on-error: true
      - name: Report translation coverage
        if: ${{ !inputs.only || inputs.only == 'warnings' || inputs.only == 'news' || inputs.only == 'deepsouth' || inputs.only == 'social' }}
        run: node tools/mt/coverage.mjs
        continue-on-error: true
      - name: Print the shape of the cyclone sources (diagnostic, writes nothing)
        if: ${{ inputs.only == 'probe' }}
        run: node tools/probe_storms.mjs
        continue-on-error: true
      - name: Probe road feeds (test only, writes probe-out/, never data/)
        if: ${{ inputs.only == 'probe-roads' }}
        run: PROBE=1 node tools/refresh_roads.mjs
        continue-on-error: true
      - name: Keep the probe output as a run artifact (test only)
        if: ${{ inputs.only == 'probe-roads' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-roads
          path: probe-out/
          retention-days: 3
      - name: Probe candidate national news feeds (diagnostic, writes nothing to the repo)
        if: ${{ inputs.only == 'probe-news' || inputs.only == 'probe-cap' }}
        run: CAP_ONLY=${{ inputs.only == 'probe-cap' && '1' || '' }} node tools/probe_news.mjs
        continue-on-error: true
      - name: Re-place current news with the place rules and compare (diagnostic, writes nothing to the repo)
        if: ${{ inputs.only == 'probe-placement' }}
        run: node tools/probe_placement.mjs
      - name: Fetch reference data for the researched country layers (diagnostic, writes probe-out/ only)
        if: ${{ inputs.only == 'probe-refdata' }}
        timeout-minutes: 22
        run: CCS="${{ vars.REFDATA_CCS || 'us gb ca de fr mx br it es ru ua pl nl ar co ve ht cu ie se no ch at be pt gr ro cz hu fi dk cl pe ec bo py uy gt hn sv ni cr pa do jm tt bs bb rs ba hr si sk bg md by al mk me xk lt lv ee is lu mt cy ad li mc sm bz gy sr ag dm gd kn lc vc' }}" node tools/probe_refdata.mjs
        continue-on-error: true
      - name: Gather dated headline leads for the researched country layers (diagnostic, writes probe-out/ only)
        if: ${{ inputs.only == 'probe-leads' }}
        timeout-minutes: 24
        run: CCS="us gb ca de fr mx br it es ru ua pl nl ar co ve ht cu ie se no ch at be pt gr ro cz hu fi dk cl pe ec bo py uy gt hn sv ni cr pa do jm tt bs bb rs ba hr si sk bg md by al mk me xk lt lv ee is lu mt cy ad li mc sm bz gy sr ag dm gd kn lc vc" SET=${{ vars.LEADS_SET || '2' }} node tools/probe_leads.mjs
        continue-on-error: true
      - name: Probe candidate UFO/UAP sighting sources for the ET tab (diagnostic, writes probe-out/ only)
        if: ${{ inputs.only == 'probe-et' }}
        timeout-minutes: 10
        run: SET=${{ vars.ET_SET || '2' }} node tools/probe_et.mjs
        continue-on-error: true
      - name: Probe candidate open-data feeds (diagnostic, writes nothing to the repo)
        if: ${{ inputs.only == 'probe-dense' }}
        run: node tools/probe_dense.mjs
        continue-on-error: true
      - name: Keep the probe output as a run artifact
        if: ${{ always() && (inputs.only == 'probe-dense' || inputs.only == 'dense') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-dense
          path: |
            probe-out/
            data/live/x/
          if-no-files-found: ignore
      # A test run of the dense feeds on a feature branch parks its output on a throwaway branch (never on the feature branch or main),
      # so the result (and raw feed samples) can be checked without committing data to the branch under review.
      - name: Park dense test output on a preview-data branch
        if: ${{ (inputs.only == 'dense' || inputs.only == 'deepsouth' || inputs.only == 'news' || inputs.only == 'topics' || inputs.only == 'et' || inputs.only == 'social' || inputs.only == 'warnings' || inputs.only == 'probe-news' || inputs.only == 'probe-cap' || inputs.only == 'probe-refdata' || inputs.only == 'probe-leads' || inputs.only == 'probe-et') && github.ref != 'refs/heads/main' }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan dense-preview-data
          git rm -rqf --cached .
          for p in data/live/x data/live/news.js data/live/news data/live/topics.js data/live/news-index.js data/live/news-index data/live/layerfeed data/live/et.js data/live/social.js data/live/social data/live/warnings.js data/live/deepsouth.js probe-out; do git add -f "$p" 2>/dev/null || true; done
          git commit -qm "Test output ($ONLY) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin "HEAD:refs/heads/claude/dense-preview-data$([ "$ONLY" = dense ] || echo "-$ONLY")"
        continue-on-error: true
      # Test of the outage alerts (any branch): reads the published data health and posts one [test] message to the channel.
      - name: Send a test message to the data health channel
        if: ${{ inputs.only == 'health-test' }}
        run: node tools/health.mjs build && node tools/health.mjs watch && node tools/health.mjs test
      # Data health (tools/health.mjs): each feed file's own time stamp and failed sources, into data/live/health.json, which the
      # app's data badge reads and the keeper checks every 15 minutes to send outage alerts. Main only, so it is committed below.
      - name: Write the data health file
        if: ${{ github.ref == 'refs/heads/main' && !startsWith(inputs.only, 'probe') }}
        run: node tools/health.mjs build
        continue-on-error: true
      # Only main commits snapshots; a run on a feature branch is a test and must not add data to the branch.
      - name: Commit if a snapshot changed
        if: ${{ inputs.only != 'probe' && inputs.only != 'probe-roads' && inputs.only != 'probe-dense' && inputs.only != 'probe-news' && inputs.only != 'probe-cap' && inputs.only != 'probe-deepsouth' && inputs.only != 'probe-placement' && inputs.only != 'probe-refdata' && inputs.only != 'probe-leads' && inputs.only != 'probe-et' && github.ref == 'refs/heads/main' }}
        env:
          LANE: ${{ inputs.lane }}
        run: |
          git add -N data/live data/history
          if git diff --quiet data/thailand/flood-live-snapshot.js data/live data/history; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thailand/flood-live-snapshot.js data/live data/history
          git commit -m "Refresh live snapshots${LANE:+ ($LANE)} $(date -u +'%Y-%m-%d %H:%MZ')"
          # Pulling takes over a minute, and merges or the other refresh jobs often land on main meanwhile, so try a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1

  # Event summaries and conflict watch lists (tools/refresh_evsum.mjs), in their own job after the refresh so they never slow it
  # down or make it time out. Grouped events reported by two or more different sources, found by opening each country's page
  # headless on the repo's own data, and "flashpoints and events to watch" for the countries with a key terrain and flashpoints
  # file, drafted through GitHub Models with this job's own token (models: read; no personal key). At most once an hour, 140
  # drafts a day; other runs end at once. Shown in the app as a draft, AI-generated, not analyst-approved.
  evsum:
    needs: refresh
    if: ${{ always() && ((!inputs.only && inputs.lane != 'fast') || inputs.only == 'evsum' || inputs.only == 'probe-models') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # on main, the commit the refresh job has just pushed
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Check that GitHub Models answers (diagnostic, writes nothing)
        if: ${{ inputs.only == 'probe-models' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: EVSUM_PROBE=1 node tools/refresh_evsum.mjs
      - name: Draft event summaries and conflict watch lists
        if: ${{ inputs.only != 'probe-models' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVSUM_FORCE: ${{ inputs.only == 'evsum' && '1' || '' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1 >/dev/null 2>&1 || true
          node tools/refresh_evsum.mjs
        timeout-minutes: 12
        continue-on-error: true
      - name: Park test output on a preview-data branch
        if: ${{ inputs.only == 'evsum' && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan evsum-preview-data
          git rm -rqf --cached .
          for p in data/live/evsum.js data/live/aiwatch.js; do git add -f "$p" 2>/dev/null || true; done
          git commit -qm "Test output (evsum) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/dense-preview-data-evsum
        continue-on-error: true
      - name: Commit the summaries if they changed
        if: ${{ github.ref == 'refs/heads/main' && inputs.only != 'probe-models' }}
        run: |
          git add -N data/live/evsum.js data/live/aiwatch.js 2>/dev/null || true
          if git diff --quiet -- data/live/evsum.js data/live/aiwatch.js; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/evsum.js data/live/aiwatch.js
          git commit -m "Refresh event summaries $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1

  # Daily country summaries (tools/refresh_daily.mjs): once a UTC day, the first run after 0000Z writes one summary per country from
  # what the refresh has just committed (the filtered news pool, conflict tabs, warnings, advisories, watch lists, country briefs):
  # top lines, key events with every source link, and what to watch. Built by rules, so it works with no AI. Where GitHub Models
  # answers (this job's own token, models: read; no personal key), the top lines of the priority countries are redrafted from the
  # same numbered sources and shown as AI generated. Other runs of the day end at once (an AI retry at most every 3 hours).
  daily:
    needs: refresh
    if: ${{ always() && ((!inputs.only && inputs.lane != 'fast') || inputs.only == 'daily') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # on main, the commit the refresh job has just pushed
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the daily country summaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_FORCE: ${{ inputs.only == 'daily' && '1' || '' }}
        run: node tools/refresh_daily.mjs
        timeout-minutes: 8
        continue-on-error: true
      - name: Park test output on a preview-data branch
        if: ${{ inputs.only == 'daily' && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan daily-preview-data
          git rm -rqf --cached .
          for p in data/live/daily.js data/live/daily; do git add -f "$p" 2>/dev/null || true; done
          git commit -qm "Test output (daily) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/dense-preview-data-daily
        continue-on-error: true
      - name: Commit the summaries if they changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git add -N data/live/daily.js data/live/daily 2>/dev/null || true
          if git diff --quiet -- data/live/daily.js data/live/daily; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/daily.js data/live/daily
          git commit -m "Refresh daily summaries $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1

  # Push watches (tools/push_watches.mjs): after each refresh, every watch in data/push/watches.json (added from the app's Push to
  # phone button) is checked by opening its country's page headless on the new data, and new matching reports are sent to the
  # watch's ntfy.sh channel. No key or account: ntfy.sh takes anonymous posts. What was already seen is kept in the Actions cache,
  # not in the repo. "push-test" (any branch) sends the newest match of each watch once, marked [test], and keeps nothing.
  push:
    needs: refresh
    if: ${{ always() && ((!inputs.only && inputs.lane != 'fast' && github.ref == 'refs/heads/main') || inputs.only == 'push' || inputs.only == 'push-test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - name: Any push watches?
        id: any
        run: echo "n=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("data/push/watches.json","utf8")).watches.length)}catch(e){console.log(0)}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.any.outputs.n != '0' }}
        with:
          node-version: 20
      - name: Restore what the push check has already seen
        if: ${{ steps.any.outputs.n != '0' && inputs.only != 'push-test' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .push-state
          key: push-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: push-state-${{ github.ref_name }}-
      - name: Check the watches and send new matches
        if: ${{ steps.any.outputs.n != '0' }}
        env:
          PUSH_TEST: ${{ inputs.only == 'push-test' && '1' || '' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1 >/dev/null 2>&1 || true
          node tools/push_watches.mjs
        timeout-minutes: 8
      - name: Keep what was seen for the next check
        if: ${{ always() && steps.any.outputs.n != '0' && inputs.only != 'push-test' && hashFiles('.push-state/state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .push-state
          key: push-state-${{ github.ref_name }}-${{ github.run_id }}
