# Test only: the Comms tab against the real OpenCelliD copy (tests/comms_live_probe.mjs). Prints to the log as notices; writes nothing.
name: Probe cell operators
on:
  push:
    branches: [claude/cell-operator-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/comms_live_probe.mjs > out.txt 2>&1 || true
      - run: node -e 'const t=require("fs").readFileSync("out.txt","utf8");for(let i=0;i<10&&i*3900<t.length;i++)console.log("::notice title=p"+i+"::"+t.slice(i*3900,(i+1)*3900).replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g,"%0A"))'
      - run: node -e 'const t=require("fs").readFileSync("shot-TH.jpg").toString("base64");for(let i=0;i<10&&i*4000<t.length;i++)console.log("::notice title=th"+String(i).padStart(2,"0")+"::"+t.slice(i*4000,(i+1)*4000))'
      - run: node -e 'const t=require("fs").readFileSync("shot-TH.jpg").toString("base64");for(let i=10;i<20&&i*4000<t.length;i++)console.log("::notice title=th"+String(i).padStart(2,"0")+"::"+t.slice(i*4000,(i+1)*4000))'
      - run: node -e 'const t=require("fs").readFileSync("shot-TH.jpg").toString("base64");for(let i=20;i<30&&i*4000<t.length;i++)console.log("::notice title=th"+String(i).padStart(2,"0")+"::"+t.slice(i*4000,(i+1)*4000))'
