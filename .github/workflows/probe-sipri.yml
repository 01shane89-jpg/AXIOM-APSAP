name: Probe SIPRI (temporary)
on:
  push:
    branches: [claude/milref-sipri]
    paths: [.github/workflows/probe-sipri.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          B=https://armstransfers.sipri.org
          curl -sS -m 60 $B/build/bundle.js -o f.txt; echo "== bundle $(wc -c < f.txt)"
          grep -oE 'https?://[a-z0-9.-]*sipri[^"`'"'"' ]{0,100}' f.txt | sort -u | head -40
          grep -oE '"/?api/p/[a-zA-Z0-9/_-]{2,80}"|`/?api/p/[^`]{2,80}`|/api/p/[a-zA-Z0-9/_-]{2,80}' f.txt | sort -u | head -80
          for k in import-export-csv-str getallcountries trades/; do echo "== ctx $k"; grep -oE ".{400}$k.{700}" f.txt | head -2; done
