name: Probe SIPRI (temporary)
on:
  push:
    branches: [claude/milref-sipri]
    paths: [.github/workflows/probe-sipri.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          curl -sS -m 60 https://armstransfers.sipri.org/build/bundle.js -o f.txt
          echo "== register builder"; grep -oE '.{2500}x\.secondExport&&e\.push' f.txt | head -1
          echo "== register defaults"; grep -oE '.{100}secondExport.{0,40}' f.txt | head -5
          echo "== countries"; curl -sS -m 60 https://atbackend.sipri.org/api/p/countries/getAllCountriesTrimmed -o c.json -w "%{http_code} %{size_download}\n"; head -c 700 c.json; echo
          curl -sS -m 60 -X POST https://atbackend.sipri.org/api/p/countries/getAllCountriesTrimmed -o c2.json -w "POST %{http_code} %{size_download}\n"; head -c 300 c2.json; echo
          echo "== maxyear"; curl -sS -m 30 -X POST -H 'Content-Type: application/json' -d '{}' https://atbackend.sipri.org/api/p/trades/getMaxYear; echo
