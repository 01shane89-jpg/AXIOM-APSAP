name: Probe SIPRI (temporary)
on:
  push:
    branches: [claude/milref-sipri]
    paths: [.github/workflows/probe-sipri.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          curl -sS -m 60 https://atbackend.sipri.org/api/p/countries/getAllCountriesTrimmed -o c.json
          TH=$(jq -r '.[]|select(.CountryCode=="THA")|.EntityId' c.json); echo "TH=$TH; countries $(jq length c.json)"
          jq -c '[.[]|select(.CountryCode|test("^[A-Z]{3}$"))|.CountryCode]|length' c.json
          for role in Recipient Supplier; do
            body=$(jq -nc --arg r "$role" --argjson id "$TH" '{filters:[{field:$r,oldField:"",condition:"contains",value1:"",value2:"",listData:[$id]},{field:"activePrograms",oldField:"",condition:"contains",value1:2015,value2:2025,listData:[]},{field:"opendeals",oldField:"",condition:"",value1:"",value2:"",listData:[]}],logic:"AND"}')
            t0=$(date +%s.%N)
            curl -sS -m 120 -X POST -H 'Content-Type: application/json' -d "$body" 'https://atbackend.sipri.org/api/p/trades/trade-register-csv/?output=csv' -o r.json -w "$role %{http_code} %{size_download}\n"
            echo "secs $(echo "$(date +%s.%N) - $t0" | bc)"
            head -c 200 r.json; echo
            jq -r '.bytes // empty' r.json | base64 -d > r.csv; wc -l r.csv; head -c 2500 r.csv; echo
          done
