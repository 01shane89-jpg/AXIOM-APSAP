name: Probe SIPRI (temporary)
on:
  push:
    branches: [claude/milref-sipri]
    paths: [.github/workflows/probe-sipri.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          curl -sS -m 60 https://armstransfers.sipri.org/build/bundle.js -o f.txt
          echo "== endpoints"; grep -oE 'Ya\(\)\+"[^"]{2,80}"' f.txt | sort | uniq -c
          for k in 'checkIP' 'function Ma\(' 'Ma=' 'function Ya\(' 'Ya=' 'trade-register' 'field:"'; do echo "== ctx $k"; grep -oE ".{300}$k.{500}" f.txt | head -3; done
          echo "== checkIP"; curl -sS -m 60 -i https://atbackend.sipri.org/api/p/login/checkIP/ | head -c 1200; echo
