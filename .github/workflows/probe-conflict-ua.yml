# Test only: checks the free, no-key sources for the Russia-Ukraine conflict tab from GitHub's runners.
# Prints to the log and uploads probe-out/ukraine.json as an artifact; writes nothing to the repo.
name: Probe Ukraine conflict sources
on:
  push:
    branches: [claude/ukraine-conflict]
    paths: [tools/probe_ukraine.mjs, tools/probe_ukraine.json, .github/workflows/probe-conflict-ua.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node tools/probe_ukraine.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-ukraine
          path: probe-out/
