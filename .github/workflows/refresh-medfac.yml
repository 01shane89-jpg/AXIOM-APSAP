# Stored health facilities and landing sites for the Medical plan (tools/build_medfac.mjs -> data/medfac), so the plan
# lists hospitals even when Overpass is down. Each run builds the countries never stored first, then any older than four
# weeks, until its time budget is spent; a daily run fills the world in a few days and then keeps it fresh. It commits on
# the branch it runs on (main on schedule).
name: Refresh medical plan facilities

on:
  # a push of the builder on a medical-plan branch builds there, so the plan can be previewed and tested with real data
  push:
    branches: ["claude/medplan-*"]
    paths: ["tools/build_medfac.mjs", ".github/workflows/refresh-medfac.yml"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes to rebuild (space separated); empty builds the next countries due"
        required: false
        default: ""
      budget:
        description: "Minutes to spend"
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: refresh-medfac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build
        env:
          MEDFAC_BUDGET_MIN: ${{ inputs.budget || '45' }}
          COUNTRIES: ${{ inputs.countries }}
        run: node tools/build_medfac.mjs $COUNTRIES
      - name: Commit
        run: |
          git add -A data/medfac
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh medical plan facilities $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
