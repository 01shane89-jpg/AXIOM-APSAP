# Test only: checks every base map draws tiles, on the live site and on this branch (tools/basemap_smoke.mjs).
# Prints to the log and uploads screenshots as an artifact; writes nothing to the repo.
name: Probe base maps
on:
  push:
    branches: [claude/basemap-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/basemap_smoke.mjs https://01shane89-jpg.github.io/AXIOM-APSAP/
      - run: node tools/basemap_smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: basemap-smoke
          path: probe-out/
