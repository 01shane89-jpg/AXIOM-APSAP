# Test only: sends the power grid layer's Overpass queries to the public servers and switches the layer on headless
# against them (tools/probe_power.mjs). Prints to the log; writes nothing to the repo.
name: Probe power grid
on:
  push:
    branches: [claude/power-grid-fix]
    paths: [tools/probe_power.mjs, assets/osap-power.js, .github/workflows/probe-power.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/probe_power.mjs
