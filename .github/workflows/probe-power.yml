# Test only: sends the app's own OpenStreetMap queries to Postpass (tools/probe_osm.mjs) and the power grid's to Postpass and
# Overpass (tools/probe_power.sh). Prints to the log; writes nothing to the repo.
name: Probe OpenStreetMap sources
on:
  push:
    branches: [claude/th-power-lines, claude/osm-reader, claude/osm-reader-2, claude/bridge-details]
    paths: [tools/probe_power.sh, tools/probe_osm.mjs, assets/osap-osm.js, assets/osap-power.js, assets/osap-surveil.js, assets/osap-lz.js, assets/osap-comms.js, assets/osap-seatransit.js, assets/osap-medplan.js, assets/osap-epe.js, assets/osap-route.js, assets/osap-preview.js, assets/osap-bridges.js, .github/workflows/probe-power.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node tools/probe_osm.mjs
