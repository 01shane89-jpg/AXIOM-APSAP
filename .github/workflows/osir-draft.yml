name: Draft OSIR analyst sections (AI)

# Once a day (tools/refresh_osirdraft.mjs): for each topic in tools/osirdraft_topics.json, a draft of the OSIR's analyst sections
# (graded claims with proposed grades, assessment, alternative explanations, proposed confidence, indicators, gaps; never the
# Summary, which the analyst writes) from the records OSAP holds for the past 30 days, drafted through GitHub Models with this
# job's own token (models: read; no personal key). Written to data/live/osirdraft.js; the OSIR window's "Fill from AI draft"
# reads it, and every filled part stays tagged AI generated (draft, not analyst-approved) until the analyst edits it.
# Run it by hand with a country (and optionally a topic and days) to draft one topic on demand. A run on any branch other than
# main parks its output on claude/osirdraft-preview-data instead of committing.
# The daily drafting of the watched topics moved to .github/workflows/refresh-ai.yml (every 3 hours, on the runner's own model,
# because GitHub Models answers these runners with "OK" and no reply); this workflow keeps the on-demand run for one topic.
on:
  workflow_dispatch:
    inputs:
      cc:
        description: "Country code for one topic on demand (e.g. th, mm, ph); empty drafts the watched topics"
        required: false
        default: ""
      scope:
        description: "Topic as the OSIR window's Topic list names it (e.g. cf-thailand-deep-south); empty = all reporting"
        required: false
        default: ""
      days:
        description: "Days ending today (1 to 365)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: osir-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Draft the analyst sections
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OSIRDRAFT_CC: ${{ inputs.cc }}
          OSIRDRAFT_SCOPE: ${{ inputs.scope }}
          OSIRDRAFT_DAYS: ${{ inputs.days }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1 >/dev/null 2>&1 || true
          node tools/refresh_osirdraft.mjs
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan osirdraft-preview-data
          git rm -rqf --cached .
          git add -f data/live/osirdraft.js
          git commit -qm "Test output (osirdraft) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/osirdraft-preview-data
      - name: Commit if the drafts changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git add -N data/live/osirdraft.js 2>/dev/null || true
          if git diff --quiet -- data/live/osirdraft.js; then echo "no change"; exit 0; fi
          git config user.name "asap-osirdraft[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/osirdraft.js
          git commit -m "Draft OSIR analyst sections $(date -u +'%Y-%m-%d %H:%MZ')"
          bash tools/push_rebase.sh main theirs 3 && exit 0
          exit 1
