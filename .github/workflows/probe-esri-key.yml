# TEMPORARY (removed before merge): reads the deploy preview's /api/esri-probe (which Esri basemaps the site's key can use)
# and Esri's public catalogue, and prints both as notices. Writes nothing.
name: Probe Esri key
on:
  push:
    branches: [claude/all-esri-basemaps]
    paths: [netlify/functions/esri-probe.mjs, .github/workflows/probe-esri-key.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Public Esri catalogue
        run: |
          for f in "" Canvas Elevation Ocean Reference Specialty; do
            curl -sS "https://server.arcgisonline.com/ArcGIS/rest/services/${f}?f=json" | jq -c '[.folders, [.services[]? | .name + "/" + .type]]' | cut -c1-3800 | sed 's/^/::notice title=public '"$f"'::/'
          done
      - name: Key probe from the deploy preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:claude/all-esri-basemaps&state=open" --jq '.[0].number')
          echo "PR $n"
          u="https://deploy-preview-${n}--axiom-osap.netlify.app/api/esri-probe"
          sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          for i in $(seq 1 60); do
            code=$(curl -sS -o out.json -w '%{http_code}' "$u" || true)
            if [ "$code" = "200" ] && jq -e ".tileChecks or (.key == false)" out.json >/dev/null 2>&1; then break; fi
            echo "try $i: $code"; sleep 20
          done
          jq -c . out.json | fold -w 3800 > chunks.txt; wc -l chunks.txt
          sed -n '1,10p' chunks.txt | nl -ba | sed 's/^ *\([0-9]*\)\t/::notice title=probe \1::/'
      - name: More 11
        run: sed -n '11,20p' chunks.txt | nl -ba -v 11 | sed 's/^ *\([0-9]*\)\t/::notice title=probe \1::/'
      - name: More 21
        run: sed -n '21,30p' chunks.txt | nl -ba -v 21 | sed 's/^ *\([0-9]*\)\t/::notice title=probe \1::/'
      - name: More 31
        run: sed -n '31,40p' chunks.txt | nl -ba -v 31 | sed 's/^ *\([0-9]*\)\t/::notice title=probe \1::/'
