# Scratch (claude/iran-war-reels, never merged): records the Iran war reel clip (tools/promo_video.mjs scene "iranwar")
# from the newest main, phone view, and pushes it to media/promo-iranwar-phone. Writes nothing to main.
name: Iran war reel clips
on:
  push:
    branches: [claude/iran-war-reels]
    paths: [tools/promo_video.mjs, .github/workflows/iran-war-reels.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        view: [phone]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the public addresses
        run: |
          for u in https://osap.axiom-intelligence-systems.com/ https://axiom-intelligence-systems.com/ https://axiom-intelligence-systems.com/osap https://www.axiom-intelligence-systems.com/osap https://axiom-osap.netlify.app/; do
            echo "ADDR $u -> $(curl -s -o /tmp/b -w '%{http_code} %{url_effective}' -L -m 20 "$u") title=$(grep -o '<title>[^<]*' /tmp/b | head -1)"
          done
          getent hosts osap.axiom-intelligence-systems.com || echo "ADDR no DNS for osap."
      - name: Use the newest data from main
        run: git fetch -q --depth 1 origin main && git checkout FETCH_HEAD -- . ':(exclude)tools/promo_video.mjs' ':(exclude).github'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: VIEW=${{ matrix.view }} OUT=pub node tools/promo_video.mjs 2>&1 | tee pub-log.txt
        env:
          ONLY: iranwar
      - name: Push the clips
        env:
          TOKEN: ${{ github.token }}
        run: |
          cp pub-log.txt pub/log.txt && cd pub && ls -la
          git init -q -b media/promo-iranwar-${{ matrix.view }}
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898269+github-actions[bot]@users.noreply.github.com" commit -q -m "promo clips (${{ matrix.view }}) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media/promo-iranwar-${{ matrix.view }}
