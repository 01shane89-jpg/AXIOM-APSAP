# Reads hospitals' own websites for the medical plan's documented capabilities (tools/read_hospital_sites.mjs).
# Commits hospital-sites-out/hospital-sites-<cc>.json to this working branch only (never main); the quotes are reviewed
# before any is used.
name: Read hospital websites
on:
  push:
    branches: [claude/hospital-sites]
    paths: [tools/read_hospital_sites.mjs, .github/workflows/read-hospital-sites.yml]
  workflow_dispatch:
    inputs:
      cc:
        description: Country code
        default: th
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/read_hospital_sites.mjs "${CC:-th}" hospital-sites-out
        env:
          CC: ${{ github.event.inputs.cc }}
      - name: Commit the result to this branch
        if: github.ref == 'refs/heads/claude/hospital-sites'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hospital-sites-out
          git commit -m "Hospital websites read $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin claude/hospital-sites && git push origin HEAD:claude/hospital-sites
