# Territorial sea lines (data/basemap/ts12/), built from Marine Regions by tools/build_ts12.mjs. Runs on a claude/ts12-* branch
# push that changes the builder, or by hand, and commits the files on the branch it runs on. No key, no account.
# Bot commits do not start CI: push again after it lands.
name: Build territorial sea lines

on:
  push:
    branches: ["claude/ts12-*"]
    paths: ["tools/build_ts12.mjs", ".github/workflows/build-ts12.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ts12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build
        run: node --max-old-space-size=6144 tools/build_ts12.mjs
        timeout-minutes: 15
      - name: Commit
        run: |
          git add -A data/basemap/ts12
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Territorial sea lines from Marine Regions $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
