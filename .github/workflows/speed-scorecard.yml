name: Alert speed scorecard

# Daily: how fast OSAP's alerts were in the last 24 hours against the goal (beat Dataminr on alerts that are not natural
# hazards; targets in tools/speed_scorecard.mjs). Reads the flash loop's own logs and writes the scorecard to this run's summary,
# where the nightly run reads it for the morning summary. Commits nothing.
on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node tools/speed_scorecard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
