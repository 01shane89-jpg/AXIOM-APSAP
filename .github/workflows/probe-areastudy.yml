# Test only: opens the Area study in a headless browser against the real free, no-key hosts it uses
# (tools/areastudy_live.mjs). Prints to the log and uploads screenshots and the PDF; writes nothing to the repo.
name: Probe area study hosts
on:
  push:
    branches: [claude/area-study]
    paths: [tools/areastudy_live.mjs, assets/osap-areastudy.js, .github/workflows/probe-areastudy.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p areastudy-out && OUT=areastudy-out node tools/areastudy_live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: areastudy-live
          path: areastudy-out
          retention-days: 7
