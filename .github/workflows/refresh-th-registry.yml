# Thailand's official hospital records for the hospital layer and the Medical plan (tools/build_th_registry.mjs ->
# data/hospitals/th/registry.json): HA Thailand open data (hospital codes, type, beds, MOPH service level, accreditation,
# certified programmes) and Open Development Thailand's MOPH facility locations, placed on OSAP's stored OpenStreetMap copy.
# Fixed public download links only, robots.txt checked, 10 s between requests, no keys. Monthly; it commits on the branch
# it runs on (main on schedule).
name: Refresh Thai hospital records

on:
  # a push of the builder on its branch builds there, so the plan can be previewed with real data
  push:
    branches: ["claude/hospital-th-*"]
    paths: ["tools/build_th_registry.mjs", ".github/workflows/refresh-th-registry.yml"]
  schedule:
    - cron: "37 4 9 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-th-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build
        run: node tools/build_th_registry.mjs
      - name: Commit
        run: |
          git add -A data/hospitals/th/registry.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh Thai hospital records $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
