# Test only: checks the flood tile hosts and the colours in their tiles (tools/probe_flood.sh). Prints to the log; writes nothing.
name: Probe flood tiles
on:
  push:
    branches: [claude/flood-overlay-fix]
    paths: [tools/probe_flood.sh, .github/workflows/probe-flood.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_flood.sh
