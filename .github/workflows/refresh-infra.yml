# Stored infrastructure sites for Map overlays > Infrastructure (tools/build_infra.mjs -> data/infra): airfields and heliports
# (OurAirports), ports (NGA World Port Index, OpenStreetMap), dams (OpenStreetMap, Wikidata), submarine cables and landing points
# (TeleGeography, non-commercial), power plants of every fuel (WRI, Wikidata, OpenStreetMap), refineries, fuel depots, LNG
# terminals and pipelines (OpenStreetMap), railways and stations, bridges and tunnels, water and sewage works, telephone exchanges,
# government seats, prisons, border crossings, police and fire stations (OpenStreetMap, Wikidata). Every country. Twice a week; OpenStreetMap is read in tiles, a time-boxed share each run; commits on the branch it runs on (main on schedule). A source that fails
# keeps its last good copy and is reported in data/infra/index.json.
name: Refresh infrastructure sites

on:
  # a push of the builder on an infrastructure branch builds there, so the layer can be previewed and tested with real data
  push:
    branches: ["claude/infra-sites*"]
    paths: ["tools/build_infra.mjs", ".github/workflows/refresh-infra.yml"]
  schedule:
    - cron: "17 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build
        env:
          INFRA_DEBUG: "1"
          # minutes of OpenStreetMap tile reads per run; the rest of the build takes about 15
          INFRA_OSM_MIN: "85"
        run: node tools/build_infra.mjs
      - name: Commit
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git add -A data/infra
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh infrastructure sites $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
