name: Refresh live air traffic

# Live air traffic (tools/refresh_air.mjs): sweeps adsb.fi and adsb.lol circle by circle around the globe (plus OpenSky's
# whole-world snapshot every 15 minutes), about every five minutes while a run lasts, and writes one file per 10° map cell to the live-air branch (one commit, replaced each time, so
# the branch never grows). The page reads the cells on screen from raw.githubusercontent.com, which lets any site read them
# (the aggregators do not). raw.githubusercontent.com serves each file for up to five minutes, so positions are typically
# five to fifteen minutes old on the map; each pop-up shows its age. The aircraft are never committed to main.
# GPS interference (tools/gnss.mjs): the same sweeps keep hourly per-cell counts of aircraft reporting good and poor GPS accuracy
# (gnss-state.json on the live-air branch); when an hour completes, main gets data/live/gnss/latest.json (rolling 24 h) and
# the UTC day's file, so this job commits to main at most about once an hour.
on:
  schedule:
    # each run sweeps for about 14 minutes; GitHub starts scheduled runs late when busy, so gaps of a few minutes are normal
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:
    inputs:
      sweeps:
        description: "Sweeps in this run (about five minutes each)"
        required: false
        default: "3"
      gnss_flush:
        description: "Test only: close the GPS-interference hour after each sweep so its files are written at once"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh-air-${{ github.ref }}
  cancel-in-progress: false

jobs:
  air:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Sweep and publish
        env:
          SWEEPS: ${{ inputs.sweeps || '3' }}
          # main publishes to live-air, the page's source; a test run on any other branch publishes to live-air-test
          TARGET: ${{ github.ref == 'refs/heads/main' && 'live-air' || 'live-air-test' }}
          GNSS_DIR: data/live/gnss
          GNSS_FLUSH: ${{ inputs.gnss_flush || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/la/prev
          # carry on from the last published files (which circles had aircraft, aircraft not asked about again yet)
          git fetch -q --depth=1 origin "$TARGET" 2>/dev/null && git archive FETCH_HEAD | tar -x -C /tmp/la/prev 2>/dev/null || true
          git worktree add -q --detach /tmp/lawt
          for i in $(seq 1 "$SWEEPS"); do
            rm -rf /tmp/la/out
            if node tools/refresh_air.mjs /tmp/la/out /tmp/la/prev 290; then
              rm -rf /tmp/la/prev && cp -r /tmp/la/out /tmp/la/prev
              ( cd /tmp/lawt && git checkout -q --orphan "la-$i" && git rm -rfq . && cp -r /tmp/la/out/. . && git add -A &&
                git commit -qm "Live air traffic $(date -u +%FT%H:%MZ)" && git push -q -f origin "HEAD:refs/heads/$TARGET" ) || echo "publish failed"
            fi
          done
          ls -l /tmp/la/prev/gnss-state.json data/live/gnss 2>/dev/null || true
          if [ -f data/live/gnss/latest.json ]; then
            node -e 'const j=require("./data/live/gnss/latest.json");console.log("GPS interference", j.from, "to", j.to, j.hours + " h", JSON.stringify(j.counts), j.cells.length + " cells");const t=j.cells.filter(c=>c[3]/c[2]>0.25).sort((a,b)=>b[3]/b[2]-a[3]/a[2]).slice(0,25);console.log(JSON.stringify(t))'
          fi
      # Only main commits, and only data/live/gnss (written when an hour completed). Other refresh jobs commit to main too,
      # so rebase onto it and retry.
      - name: Commit GPS interference map
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          [ -d data/live/gnss ] || exit 0
          git add -N data/live/gnss
          if git diff --quiet -- data/live/gnss; then echo "no change"; exit 0; fi
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live/gnss
          git commit -qm "Refresh GPS interference map $(date -u +'%Y-%m-%d %H:%MZ')"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep 7; done
          exit 1
