# Guards against merges that silently drop script tags or feature code from index.html,
# and checks headless that the map still draws its objects and military symbols.
# The list of required lines is tools/required-in-index.txt. On a PR it also fails when the PR changes sw.js VERSION
# (main sets it after merge: .github/workflows/sw-version.yml).
name: Check index.html
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  required-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - run: node tools/check_index.mjs
      # PRs keep main's sw.js VERSION so open PRs do not conflict on it; HEAD^1 of the PR merge ref is the base commit
      - if: github.event_name == 'pull_request'
        run: node tools/sw_version.mjs --same-as HEAD^1
      # data health rules and tools/health.json (outage alerts and the app's data badge)
      - run: node tests/health.test.mjs
      - run: node tests/view_reports.test.mjs
      - run: node tests/geo.test.mjs
      - run: node tests/milsites.test.mjs
      - run: node tests/comms.test.mjs
      - run: node tests/gazetteer.test.mjs
      - run: node tests/illum.test.mjs
      - run: node tests/hosp.test.mjs
  map-smoke:
    # Opens Thailand's map headless and fails when a tab draws nothing or the page throws (tools/smoke_map.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke_map.mjs
      - run: node tests/locate_smoke.mjs
      - run: node tests/atak_smoke.mjs
      - run: node tests/area_shapes_smoke.mjs
      - run: node tests/points_smoke.mjs
      - run: node tests/3d_smoke.mjs
      - run: node tests/milsym_smoke.mjs
      - run: node tests/milsites_smoke.mjs
      - run: node tests/cf_layout_smoke.mjs
      - run: node tests/sides_smoke.mjs
      - run: node tests/hillshade_smoke.mjs
      - run: node tests/maploading_smoke.mjs
      - run: node tests/sw_data_smoke.mjs
      - run: node tests/offline_smoke.mjs
      - run: node tests/workspaces_smoke.mjs
      - run: node tests/move_smoke.mjs
      - run: node tests/timeline_scope_smoke.mjs
      - run: node tests/period_smoke.mjs
      - run: node tests/search_smoke.mjs
      - run: node tests/grid_smoke.mjs
      - run: node tests/comms_smoke.mjs
      - run: node tests/power_smoke.mjs
      - run: node tests/cams_smoke.mjs
      - run: node tests/privacy_smoke.mjs
      - run: node tests/borders_smoke.mjs
      - run: node tests/evac_smoke.mjs
      - run: node tests/evacroute_smoke.mjs
      - run: node tests/route_wpdel_smoke.mjs
      - run: node tests/dc_smoke.mjs
      - run: node tests/traffic_smoke.mjs
      - run: node tests/medplan_smoke.mjs
      - run: node tests/lz_smoke.mjs
      - run: node tests/event_pin_smoke.mjs
      - run: node tests/layout_list_smoke.mjs
      - run: node tests/reports_smoke.mjs
      - run: node tests/illum_smoke.mjs
      - run: node tests/watch_links_smoke.mjs
      - run: node tests/speed_budget.mjs
