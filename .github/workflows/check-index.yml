# Guards against merges that silently drop script tags or feature code from index.html,
# and checks headless that the map still draws its objects and military symbols.
# The list of required lines is tools/required-in-index.txt.
name: Check index.html
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  required-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node tools/check_index.mjs
  map-smoke:
    # Opens Thailand's map headless and fails when a tab draws nothing or the page throws (tools/smoke_map.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke_map.mjs
