# Guards against merges that silently drop script tags or feature code from index.html,
# and checks headless that the map still draws its objects and military symbols.
# The list of required lines is tools/required-in-index.txt. On a PR it also fails when the PR changes sw.js VERSION
# (main sets it after merge: .github/workflows/sw-version.yml).
name: Check index.html
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# One run per PR (a newer push cancels the older run) and one at a time on main (a waiting run is replaced by the newest push,
# which carries every commit before it). Without this, superseded runs of the ~60-minute map-smoke filled the 20 concurrent
# jobs on 24 Oct 2026 (22 runs at once) and scheduled refresh jobs (refresh-ai 01:23Z, 02:53Z, 03:53Z) never started.
concurrency:
  group: check-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  required-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - run: node tools/check_index.mjs
      # the map-smoke list (tests/map-smoke.txt): every file there, none twice, every shard plan runs each test once
      - run: node tools/smoke_shard.mjs --check
      # hidden areas (tools/hidden-areas.json): their files must be sealed, never plain, in the repository
      - run: node tools/seal_hidden.mjs --check --skip-live
      - run: node tests/seal.test.mjs
      # paid plans (TIER_SEALED in tools/tiers.mjs): their files must be sealed for the tier key, never plain, in the public repository
      - run: node tools/seal_tier.mjs --check
      - run: node tests/seal_tier.test.mjs
      # local time and military zone letter at the map readout's grid (assets/osap-zonetime.js, data/basemap/tz-zones.json)
      - run: node tests/zonetime.test.mjs
      # the paywall (tools/tiers.mjs, netlify/): what each plan opens, the edge gate, Paddle webhooks
      - run: npm ci --prefix netlify --no-audit --no-fund
      - run: node tests/tier.test.mjs
      # reviews (tools/reviews.mjs, netlify/functions/osap-reviews.mjs) and when the app asks for one (assets/osap-reviews.js)
      - run: node tests/reviews.test.mjs
      # team shared cases (tools/cases.mjs, netlify/functions/osap-cases.mjs): roles, case isolation, decision records
      - run: node tests/cases.test.mjs
      - run: node tests/case_vault.test.mjs
      # Team, Organisation and paid pilot (tools/teams.mjs, netlify/functions/osap-teams.mjs): seats, roles, Paddle sandbox, webhooks
      - run: node tests/teams.test.mjs
      # Netlify production deploys come in batches (tools/netlify_ignore.mjs): 15 credits each
      - run: node tests/netlify_ignore.test.mjs
      # IMB PRC piracy map reader, the NGA ASAM backup (tools/imb_piracy.mjs)
      - run: node tests/imb_piracy.test.mjs
      - run: node tests/recaap_incidents.test.mjs
      - run: node tests/ukmto_incidents.test.mjs
      # new dense feeds of 8 Nov (tools/dense_nov8.mjs): PortWatch, RFJ, VAAC, UNSC, USGS blasts, BfS, RIPE, UN PKO, EU regimes, satellite passes
      - run: node tests/dense_nov8.test.mjs
      - run: node tests/uk_sanctions.test.mjs
      # PRs keep main's sw.js VERSION so open PRs do not conflict on it; HEAD^1 of the PR merge ref is the base commit
      - if: github.event_name == 'pull_request'
        run: node tools/sw_version.mjs --same-as HEAD^1
      # data health rules and tools/health.json (outage alerts and the app's data badge)
      - run: node tests/health.test.mjs
      # live air traffic relay for the area on screen (netlify/edge-functions/osap-air.js)
      - run: node tests/air_live.test.mjs
      - run: node tests/osm_sources.test.mjs
      - run: node tests/avwx.test.mjs
      - run: node tests/claims.test.mjs
      - run: node tests/incidents.test.mjs
      - run: node tests/decisions.test.mjs
      - run: node tests/cf_decisions.test.mjs
      - run: node tests/cf_match.test.mjs
      - run: node tests/cf_code.test.mjs
      - run: node tests/coded_protests.test.mjs
      - run: node tests/coded_polecat.test.mjs
      - run: node tests/captures.test.mjs
      - run: node tests/source_registry.test.mjs
      - run: node tests/places_deepsouth.test.mjs
      - run: node tests/places_areas.test.mjs
      - run: node tests/view_reports.test.mjs
      - run: node tests/sat.test.mjs
      - run: node tests/newimg.test.mjs
      - run: node tests/geo.test.mjs
      - run: node tests/tak.test.mjs
      - run: node tests/milsites.test.mjs
      - run: node tests/deepsouth_border.test.mjs
      - run: node tests/entities.test.mjs
      - run: node tests/deepsouth_peace.test.mjs
      - run: node tests/deepsouth_kinds.test.mjs
      - run: node tests/conflict_figures.test.mjs
      - run: node tests/social_relevance.test.mjs
      - run: node tests/relevance_sample.test.mjs
      - run: node tests/social_replies.test.mjs
      - run: node tests/comms.test.mjs
      - run: node tests/commsplan.test.mjs
      - run: node tests/gazetteer.test.mjs
      - run: node tests/history_pins.test.mjs
      - run: node tests/country_bounds.test.mjs
      - run: node tests/illum.test.mjs
      # DZSO sheet maths and the shared drop zone store (assets/osap-dzso.js, assets/osap-dz.js)
      - run: node tests/dzso.test.mjs
      # site survey geometry: ends, corners, corridors, n:1 clearance (assets/osap-survey.js)
      - run: node tests/survey.test.mjs
      # dive plan: US Navy Diving Manual Rev 7 tables read cell by cell, the manual's worked examples and rules (assets/osap-dive.js)
      - run: node tests/dive.test.mjs
      - run: node tests/osm_reader.test.mjs
      - run: node tests/keydates.test.mjs
      - run: node tests/an_auto.test.mjs
      - run: node tests/osirdraft.test.mjs
      # morning brief push: once a local morning per phone channel, Full-only summary kept from Mid (tools/push_brief.mjs)
      - run: node tests/push_brief.test.mjs
      # event-summary drafts give only figures their reports give (tools/evsum_lib.mjs)
      - run: node tests/evsum_lib.test.mjs
      # report digests: article text out of a page, and the checks on the model's reply (tools/digest_lib.mjs)
      - run: node tests/digest.test.mjs
      # AI gateway: a slow reply from the runner's model skips one request; two in a row drop it for the run (tools/ai_gateway.mjs)
      - run: node tests/ai_gateway.test.mjs
      - run: node tests/hosp.test.mjs
      - run: node tests/social_view.test.mjs
      - run: node tests/jp_ccc.test.mjs
      - run: node tests/tw_kr_designations.test.mjs
      - run: node tests/medplan_model.test.mjs
      - run: node tests/boolq.test.mjs
      # flash alerts: which push alerts are flash first reports, flash-only watches, one corroboration follow-up (tools/flash_lib.mjs)
      - run: node tests/flash.test.mjs
      - run: node tests/flash_loop.test.mjs
      - run: node tests/terrain.test.mjs
      - run: node tests/facility_intel.test.mjs
      - run: node tests/econ.test.mjs
      # risk rating equivalents: the formula, the job on the repo's feeds, official advisories never an input (tools/risk_lib.mjs)
      - run: node tests/risk.test.mjs
      - run: node tests/milref.test.mjs
      - run: node tests/medplan_decide.test.mjs
      - run: node tests/medplan_air.test.mjs
      - run: node tests/seatransit.test.mjs
      # machine translation: invented lines rejected, and a translation stays with its item
      - run: node tests/mt_guard.test.mjs
      - run: node tests/translate_keep.test.mjs
      - run: node tests/mt_confidence.test.mjs
      - run: node tests/mt_cache_lanes.test.mjs
      - run: node tests/mt_prepare.test.mjs
      # licence: outlet summaries are read by the jobs but never stored
      - run: node tests/outlet_text.test.mjs
      # sold-version switch: non-commercial sources come out in one step (tools/nc_strip.mjs)
      - run: node tests/nc_strip.test.mjs
      - run: node tests/stories.test.mjs
      - run: node tests/outlet_facts.test.mjs
      - run: node tests/flood_warnings.test.mjs
      - run: node tests/threads.test.mjs
      - run: node tests/factcheck.test.mjs
      # reporting spikes: the method on made-up counts, and the build on a made-up news index (tools/spikes_lib.mjs, news_spikes.mjs)
      - run: node tests/spikes.test.mjs
      # news relevance word lists, and the pool rechecking the rows it carries over (tools/relevance.json, tools/news_index.mjs)
      - run: node tests/topics.test.mjs
      - run: node tests/news_index_relevance.test.mjs
      # sync my devices: BIP-340 signing vectors, sync codes, sealing and the item-by-item merge
      - run: node tests/sync.test.mjs
      # the hand-off of saved work from the old github.io address (assets/osap-carry.js): the merge
      - run: node tests/carry.test.mjs
      # team workspace: team links (key after #, editor and viewer), viewers cannot sign, call signs, the 2 MB cap, the moved note
      - run: node tests/team.test.mjs
      # GPS interference map: which aircraft reports count, hourly windows, grading, day files (tools/gnss.mjs)
      - run: node tests/gnss.test.mjs
      - run: node tests/warngeo.test.mjs
      # source grading in My work: the Admiralty / NATO scale, cleaning grades and per-source defaults, escaped picker
      - run: node tests/grade.test.mjs
      # photo and video check: NOAA sun position, shadow times, metadata reader (JPEG, PNG, HEIC, MP4, MOV)
      - run: node tests/photocheck.test.mjs
      # the bundle AXIOM imports: framing and digest, non-commercial sources left out, curated records unchanged (tools/axiom_bundle_lib.mjs)
      - run: node tests/axiom_bundle.test.mjs
      # every app file index.html loads is saved by the service worker for offline use
      - run: node tests/sw_precache.test.mjs
  map-smoke-shard:
    # Opens the app headless and fails when a tab draws nothing or the page throws (tools/smoke_map.mjs and the tests listed in
    # tests/map-smoke.txt). Run one after another the suite took 75 to 90 minutes (2026-11-12, 175 tests), so a fix waited
    # 1.5 h for its answer; tools/smoke_shard.mjs spreads the tests over 6 machines by their last run times
    # (tests/map-smoke-times.json), about 14 minutes of tests each, and runs every test of a shard even after one fails.
    name: map-smoke shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      # Ubuntu's package servers sometimes fail to resolve on the runner (PR #712, 11 Nov: three runs lost before any test, and
      # each apt attempt then hung about 13 minutes). Skip apt when the runner image already has what is needed; otherwise try
      # up to 4 times, 30 s apart, each apt call capped at 5 minutes with short network timeouts
      - run: |
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then echo "chromium runs without extra packages"; exit 0; fi
          APT="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3 4; do
            sudo timeout 300 apt-get $APT update -q || true
            timeout 600 npx playwright install --with-deps chromium && exit 0
            echo "install attempt $i failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - run: npm ci --prefix netlify --no-audit --no-fund
      # pdftotext for the PDF checks (needs=poppler in tests/map-smoke.txt), only on the shard that runs them; same apt caps as above
      - run: |
          if ! node tools/smoke_shard.mjs --shard ${{ matrix.shard }}/6 --needs poppler; then echo "this shard has no PDF checks"; exit 0; fi
          if command -v pdftotext; then exit 0; fi
          APT="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3 4; do
            sudo timeout 300 apt-get $APT update -q || true
            sudo timeout 300 apt-get $APT install -y --no-install-recommends poppler-utils && exit 0
            echo "install attempt $i failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - run: node tools/smoke_shard.mjs --shard ${{ matrix.shard }}/6
  map-smoke:
    # The one check a PR waits on: green only when every shard above passed (a skipped or cancelled shard is a failure).
    if: always()
    needs: map-smoke-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "shards: ${{ needs.map-smoke-shard.result }}"
          test "${{ needs.map-smoke-shard.result }}" = "success"
  carry-webkit:
    # Also the phone-layout checks in WebKit (below). The hand-off of saved work from the old github.io address (assets/osap-carry.js) in WebKit, Safari's engine: the iPhone
    # is where most saved work sits, and Safari is the browser that decides how long an address may be.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      # Ubuntu's package servers sometimes fail to resolve on the runner (PR #712, 11 Nov: three runs lost before any test, and
      # each apt attempt then hung about 13 minutes). Skip apt when the runner image already has what is needed; otherwise try
      # up to 4 times, 30 s apart, each apt call capped at 5 minutes with short network timeouts
      - run: |
          npx playwright install webkit
          if node -e "require('playwright').webkit.launch().then(b => b.close())"; then echo "webkit runs without extra packages"; exit 0; fi
          APT="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3 4; do
            sudo timeout 300 apt-get $APT update -q || true
            timeout 600 npx playwright install --with-deps webkit && exit 0
            echo "install attempt $i failed; retrying in 30 s"; sleep 30
          done
          exit 1
      - run: BROWSER=webkit node tests/carry_smoke.mjs
      # the phone layout in WebKit, the engine every iPhone browser uses: map, toolbar and bottom sheet fit the screen, also where
      # 100svh is taller than the page (the iPhone cut-off fixed by PR #712), and the sheet never scrolls sideways
      - run: BROWSER=webkit node tests/phone_fit_smoke.mjs
      - run: BROWSER=webkit node tests/phone_sheet_sideways_smoke.mjs
      # a finger tap on a live aircraft or ship opens its details, also on a US state page where the state outline lies under it
      - run: BROWSER=webkit node tests/traffic_tap_smoke.mjs
