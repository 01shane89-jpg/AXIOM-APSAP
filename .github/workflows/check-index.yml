      # licence: outlet summaries are read by the jobs but never stored
      - run: node tests/outlet_text.test.mjs
      # sold-version switch: non-commercial sources come out in one step (tools/nc_strip.mjs)
      - run: node tests/nc_strip.test.mjs
      - run: node tests/stories.test.mjs
      # news relevance word lists, and the pool rechecking the rows it carries over (tools/relevance.json, tools/news_index.mjs)
      - run: node tests/topics.test.mjs
      - run: node tests/news_index_relevance.test.mjs
      # sync my devices: BIP-340 signing vectors, sync codes, sealing and the item-by-item merge
      - run: node tests/sync.test.mjs
      # team workspace: team links (key after #, editor and viewer), viewers cannot sign, call signs, the 2 MB cap, the moved note
      - run: node tests/team.test.mjs
      # GPS interference map: which aircraft reports count, hourly windows, grading, day files (tools/gnss.mjs)
      - run: node tests/gnss.test.mjs
      - run: node tests/warngeo.test.mjs
      # source grading in My work: the Admiralty / NATO scale, cleaning grades and per-source defaults, escaped picker
      - run: node tests/grade.test.mjs
      # photo and video check: NOAA sun position, shadow times, metadata reader (JPEG, PNG, HEIC, MP4, MOV)
      - run: node tests/photocheck.test.mjs
      # the bundle AXIOM imports: framing and digest, non-commercial sources left out, curated records unchanged (tools/axiom_bundle_lib.mjs)
      - run: node tests/axiom_bundle.test.mjs
  map-smoke:
    # Opens Thailand's map headless and fails when a tab draws nothing or the page throws (tools/smoke_map.mjs).
    runs-on: ubuntu-latest
    # the whole suite now runs about 29 to 30 minutes, so 30 cancelled green runs (2026-10-04); by 2026-10-19 it ran 43 to 45
    # minutes and 45 cancelled main and two PRs one test from the end; on 2026-10-23 it ran past 60 and cancelled PR #498 three
    # tests from the end (speed_budget at 07:44Z, 60 minutes after the start)
    # and a 12-minute browser install pushed a fully green suite past 60 the same day (PR #508)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke_map.mjs
      - run: node tests/locate_smoke.mjs
      # a US state view shows its outlets' earlier items (data/history/us-states, tools/history.mjs)
      - run: node tests/state_history_smoke.mjs
