name: Daily summaries, AI drafts in shards
run-name: "Daily AI shards (${{ github.event_name == 'pull_request' && 'test' || 'due' }})"

# Every country's daily summary should get its AI top lines the same day (Shane 2026-11-23: "close the gaps"). One model on
# one runner (.github/workflows/refresh-ai.yml) writes about 4 countries in 15 minutes, so its daily pass and 3-hourly rounds
# reached 81 of 175 countries on 22 Nov 2026. This splits what is left of today's queue over 4 runners, each with its own
# copy of the same open-weight model (no key, no account, nothing sent off the runner). The shards take the queue from the
# back (tools/daily_lib.mjs shardQueue) while refresh-ai.yml drafts from the front, so the two don't draft the same countries.
# The merge job takes a shard's draft only where main has no AI draft of that country today (tools/daily_merge.mjs), then
# rewrites the index. Drafts stay "AI generated", never analyst-approved; the same citation checks apply (tools/daily_lib.mjs
# validateAi). Four times a day, clear of the country briefs' shards (05:29, 17:29) so the 15-minute lanes keep their slots;
# a run with nothing left to draft ends in seconds.
# On a pull request that changes the shards: one shard of 2 countries, nothing committed (output as an artifact).
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Runners to split today's queue over (at most 4 run at once)"
        required: false
        default: "4"
  pull_request:
    paths:
      - tools/daily_merge.mjs
      - tools/refresh_daily.mjs
      - .github/workflows/refresh-daily-ai.yml

permissions:
  contents: read

concurrency:
  group: refresh-daily-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      due: ${{ steps.plan.outputs.due }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Count today's countries still due
        id: plan
        env:
          N: ${{ github.event_name == 'pull_request' && '1' || inputs.shards || '4' }}
        run: |
          due=$(node -e 'const t=require("fs").readFileSync("data/live/daily.js","utf8");const i=JSON.parse(t.slice(t.indexOf("=")+1).trim().replace(/;$/,""));const today=new Date().toISOString().slice(0,10);console.log(i.date===today&&i.ai&&i.ai.retry?(i.ai.due|0):0)')
          n=$N; [ "$n" -gt 4 ] && n=4; [ "$n" -lt 1 ] && n=1
          s=$(node -e 'const n=+process.argv[1];console.log(JSON.stringify([...Array(n).keys()].map(k=>k+"/"+n)))' "$n")
          [ "${due:-0}" -gt 0 ] || s='[]'
          echo "today's countries still due: ${due:-0}; shards: $s"
          echo "due=${due:-0}" >> "$GITHUB_OUTPUT"; echo "shards=$s" >> "$GITHUB_OUTPUT"

  draft:
    needs: plan
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      models: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # the same model as refresh-ai.yml's daily summaries, so every AI line of the day comes from one model
      MODEL_KEY: phi-3.5-mini
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # the same model files and server build as refresh-ai.yml (and the same cache keys, so no new download)
      - name: Pick the model file
        id: pick
        run: |
          f=Phi-3.5-mini-instruct-Q4_K_M.gguf
          echo "file=$f" >> "$GITHUB_OUTPUT"; echo "url=https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/$f" >> "$GITHUB_OUTPUT"; echo "licence=MIT" >> "$GITHUB_OUTPUT"
      - name: Restore the model and the server
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/osap-llm
          key: osap-llm-${{ steps.pick.outputs.file }}-llamacpp-0.3.2-v3
      - name: Install the model server
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
        run: |
          w=~/.cache/osap-llm/wheels; mkdir -p $w
          ls $w/llama_cpp_python-0.3.2-*.whl >/dev/null 2>&1 || python -m pip wheel --quiet --no-deps -w $w "llama-cpp-python==0.3.2"
          python -m pip install --quiet "$(ls $w/llama_cpp_python-0.3.2-*.whl | head -1)[server]"
      - name: Download the model (once; kept in the cache)
        env:
          F: ${{ steps.pick.outputs.file }}
          U: ${{ steps.pick.outputs.url }}
        run: |
          mkdir -p ~/.cache/osap-llm
          [ -s ~/.cache/osap-llm/$F ] || curl -sSfL --retry 3 -o ~/.cache/osap-llm/$F "$U"
          sha256sum ~/.cache/osap-llm/$F
      - name: Start the model server
        env:
          F: ${{ steps.pick.outputs.file }}
        run: |
          nohup python -m llama_cpp.server --model ~/.cache/osap-llm/$F --model_alias local --host 127.0.0.1 --port 8080 \
            --n_ctx 8192 --n_threads 4 > llm.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/v1/models >/dev/null && { echo "server up after ${i}x2 s"; exit 0; }; sleep 2; done
          tail -30 llm.log; exit 1
      - name: Install the Anthropic SDK
        run: npm install --no-save --no-audit --no-fund --no-package-lock @anthropic-ai/sdk@1.5.0 >/dev/null 2>&1 || echo "SDK not installed; this shard uses the free model"
      - name: Draft this shard's countries
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OSAP_LOCAL_LLM: http://127.0.0.1:8080
          OSAP_LOCAL_MODEL: ${{ steps.pick.outputs.file }} (${{ steps.pick.outputs.licence }}, on-runner)
          DAILY_CONTINUE: "1"
          DAILY_SHARD: ${{ matrix.shard }}
          DAILY_OUT: out/daily
          DAILY_AI_PER_RUN: ${{ github.event_name == 'pull_request' && '2' || '60' }}
          DAILY_AI_BUDGET_MIN: ${{ github.event_name == 'pull_request' && '10' || '60' }}
          # Claude first when the key is a repository secret; each shard may spend its share of what is left of the day's cap.
          # A pull request's test run (secrets are not given to it from forks; this repository's own branches get them) stays free.
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          OSAP_AI_ORDER: anthropic,github,local
          DAILY_ANTHROPIC_CAP_USD: "1.00"
        run: node tools/refresh_daily.mjs
      - name: Model server log (tail)
        if: ${{ always() }}
        run: tail -15 llm.log || true
      - name: Keep the drafts for the merge job
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-${{ strategy.job-index }}
          path: out/daily/
          if-no-files-found: ignore
          retention-days: 3

  merge:
    needs: [plan, draft]
    if: ${{ always() && needs.plan.outputs.shards != '[]' && needs.draft.result != 'cancelled' && needs.draft.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || (github.ref == 'refs/heads/main' && 'main' || github.ref) }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: daily-*
          path: out/daily
          merge-multiple: true
      - name: Merge the drafts and rewrite the index
        run: |
          node tools/daily_merge.mjs out/daily
          DAILY_REINDEX=1 DAILY_SPEND_DIR=out/daily node tools/refresh_daily.mjs
      - name: Show the test result (pull request or branch run; nothing committed)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git diff --stat -- data/live/daily.js data/live/daily | tail -8
          for f in out/daily/*.js; do [ -f "$f" ] && node -e 'const w={};new Function("window",require("fs").readFileSync(process.argv[1],"utf8"))(w);for(const c in w.OSAP_DAILY){const d=w.OSAP_DAILY[c].days[0];console.log(c,d.date,d.method,JSON.stringify(d.bluf))}' "$f"; done; true
      - name: Commit the summaries
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          if git diff --quiet -- data/live/daily.js data/live/daily; then echo "no change"; exit 0; fi
          git config user.name "asap-ai-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/daily.js data/live/daily
          git commit -m "AI drafts of the daily summaries, shards $(date -u +'%Y-%m-%d %H:%MZ')"
          bash tools/push_rebase.sh main theirs 3 && exit 0
          exit 1
