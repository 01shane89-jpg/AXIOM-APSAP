# Test only: prints archived TRICARE Overseas contact pages (tools/probe_tricare.sh). Writes nothing.
name: Probe TRICARE Overseas contacts
on:
  push:
    branches: ["claude/medplan-*"]
    paths: [tools/probe_tricare.sh, .github/workflows/probe-tricare.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_tricare.sh
