# Test only (temporary): which NGA MSI request returns the warnings in force now (tools/probe_nga.sh).
# Parks the log on claude/warngeo-probe-out (never main).
name: Probe NGA warnings
on:
  push:
    branches: [claude/airspace-sea-warnings]
    paths: [tools/probe_nga.sh, .github/workflows/probe-nga.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_nga.sh 2>&1 | tee probe-log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan warngeo-probe-out && git rm -rq --cached . && git add -f probe-log.txt probe-out
          git commit -qm "probe nga" && git push -qf origin HEAD:refs/heads/claude/warngeo-probe-out
