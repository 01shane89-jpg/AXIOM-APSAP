# Test only: screenshots candidate base maps over Bangkok, Tokyo and Moscow to compare label language (tools/probe_label_lang.mjs).
name: Probe label language
on:
  push:
    branches: [claude/english-map-labels]
    paths: [tools/probe_label_lang.mjs, tools/probe_label_ocr.sh, .github/workflows/probe-label-lang.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/probe_label_lang.mjs
      - run: sudo apt-get install -y -q tesseract-ocr >/dev/null
      - run: sh tools/probe_label_ocr.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: label-lang
          path: probe-out/
