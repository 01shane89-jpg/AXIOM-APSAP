# Test only: building coverage of the keyless OpenFreeMap tiles in SE Asian cities (tools/probe_buildings.mjs). Writes nothing.
name: Probe buildings
on:
  push:
    branches: [claude/3d-buildings]
    paths: [tools/probe_buildings.mjs, .github/workflows/probe-buildings.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund @mapbox/vector-tile@2 pbf@4
      - run: node tools/probe_buildings.mjs
