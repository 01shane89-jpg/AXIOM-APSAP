# Takes the user guide's screenshots (tools/guide_shots.mjs) on a phone-sized screen with live map tiles, and uploads them
# as the "guide-shots" artifact. Writes nothing to the repo: the pictures are shrunk to JPEG and committed by hand as
# assets/guide/<name>.jpg. Run it from the Actions tab after the app's look changes.
name: Guide screenshots
on:
  push:
    branches: [claude/user-guide]
    paths: [tools/guide_shots.mjs, .github/workflows/guide-shots.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/guide_shots.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-shots
          path: guide-shots/
