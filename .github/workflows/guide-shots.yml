# Takes the user guide's screenshots (tools/guide_shots.mjs) on a phone-sized screen with live map tiles and commits them as assets/guide/<name>.jpg on the branch it runs on (the guide shows them; the service worker keeps
# them for offline use). Run it from the Actions tab after the app's look changes.
name: Guide screenshots
on:
  push:
    branches: [claude/user-guide]
    paths: [tools/guide_shots.mjs, .github/workflows/guide-shots.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/guide_shots.mjs
      - name: Commit
        run: |
          ls -l assets/guide
          git add -A assets/guide
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Guide screenshots $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
