name: AI drafts on the runner

# AI drafts (labelled "AI generated", never analyst-approved) from an open-weight model that runs on the Actions runner itself,
# so no key, no account and no case material sent to an outside service. GitHub Models has answered every request from these
# runners with 200 text/plain "OK" since September 2026, so the daily summaries were rules-only; tools/ai_gateway.mjs still
# tries GitHub Models first and falls back to this local model.
# Daily, after the news lane has built the day's rules summaries (tools/refresh_daily.mjs, about 00:05Z): redraft the top lines
# and watch lines of the priority countries. The model file and the server wheel are kept in the Actions cache.
# Free while the repository is public (standard GitHub-hosted runners: 4 CPUs, 16 GB).
on:
  # TEST ONLY (remove before merge): a push to this branch runs both models on five countries and parks the output
  push:
    branches: [claude/local-ai-daily]
    paths: [tools/ai_gateway.mjs, tools/refresh_daily.mjs, .github/workflows/refresh-ai.yml]
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "qwen2.5-1.5b (Apache-2.0, fastest) or phi-3.5-mini (MIT, stronger, slower)"
        required: false
        default: "phi-3.5-mini"
      only:
        description: "Country codes for a test, e.g. th,ph,mm (empty = every priority country)"
        required: false
        default: ""
      per_run:
        description: "Most drafts this run"
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: refresh-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      models: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ github.event_name == 'push' && fromJSON('["phi-3.5-mini","qwen2.5-1.5b"]') || fromJSON(format('["{0}"]', inputs.model || 'phi-3.5-mini')) }}
    env:
      MODEL_KEY: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Pick the model file
        id: pick
        run: |
          case "$MODEL_KEY" in
            qwen2.5-1.5b) f=qwen2.5-1.5b-instruct-q4_k_m.gguf; u=https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/$f; lic=Apache-2.0 ;;
            phi-3.5-mini) f=Phi-3.5-mini-instruct-Q4_K_M.gguf; u=https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/$f; lic=MIT ;;
            *) echo "unknown model $MODEL_KEY"; exit 1 ;;
          esac
          echo "file=$f" >> "$GITHUB_OUTPUT"; echo "url=$u" >> "$GITHUB_OUTPUT"; echo "licence=$lic" >> "$GITHUB_OUTPUT"
      - name: Restore the model and the server
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/osap-llm
            ~/.cache/pip
          key: osap-llm-${{ steps.pick.outputs.file }}-llamacpp-0.3.2-v1
      - name: Install the model server
        run: python -m pip install --quiet "llama-cpp-python[server]==0.3.2" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Download the model (once; kept in the cache)
        env:
          F: ${{ steps.pick.outputs.file }}
          U: ${{ steps.pick.outputs.url }}
        run: |
          mkdir -p ~/.cache/osap-llm
          [ -s ~/.cache/osap-llm/$F ] || curl -sSfL --retry 3 -o ~/.cache/osap-llm/$F "$U"
          ls -la ~/.cache/osap-llm; sha256sum ~/.cache/osap-llm/$F
      - name: Start the model server
        env:
          F: ${{ steps.pick.outputs.file }}
        run: |
          nohup python -m llama_cpp.server --model ~/.cache/osap-llm/$F --model_alias local --host 127.0.0.1 --port 8080 \
            --n_ctx 8192 --n_threads 4 > llm.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/v1/models >/dev/null && { echo "server up after ${i}x2 s"; exit 0; }; sleep 2; done
          tail -30 llm.log; exit 1
      - name: Redraft the daily summaries' top lines
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OSAP_LOCAL_LLM: http://127.0.0.1:8080
          OSAP_LOCAL_MODEL: ${{ steps.pick.outputs.file }} (${{ steps.pick.outputs.licence }}, on-runner)
          DAILY_FORCE: "1"
          DAILY_ONLY: ${{ github.event_name == 'push' && 'th,ph,mm,ua,pk' || inputs.only }}
          DAILY_AI_PER_RUN: ${{ github.event_name == 'push' && '5' || inputs.per_run || '45' }}
          DAILY_AI_BUDGET_MIN: "80"
        run: node tools/refresh_daily.mjs
      - name: Model server log (tail)
        if: ${{ always() }}
        run: tail -15 llm.log || true
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git config user.name "asap-ai-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ai-preview-data
          git rm -rqf --cached .
          for p in data/live/daily.js data/live/daily; do git add -f "$p" 2>/dev/null || true; done
          git commit -qm "Test output (AI drafts on the runner) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/ai-preview-data-$MODEL_KEY
      - name: Commit the summaries if they changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git add -N data/live/daily.js data/live/daily 2>/dev/null || true
          if git diff --quiet -- data/live/daily.js data/live/daily; then echo "no change"; exit 0; fi
          git config user.name "asap-ai-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/daily.js data/live/daily
          git commit -m "AI drafts of the daily summaries $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
