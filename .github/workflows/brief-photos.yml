name: Brief photos (one-off scratch)
on:
  push:
    branches: [claude/brief-photos]
    paths: [brief-photos/links.json, brief-photos/fetch.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node brief-photos/fetch.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add brief-photos/img brief-photos/manifest.json
          git commit -m "Brief photos: fetched og:images" || exit 0
          git push
