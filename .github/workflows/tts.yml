name: voice-tts (scratch, never merge)
on:
  push:
    branches: [claude/voice-tts]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install "kokoro>=0.9.4" soundfile
      - run: python tts/gen.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -m "Narration audio [skip ci]" && git push
