name: voice-tts (scratch, never merge)
on:
  push:
    branches: [claude/voice-tts]
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install "kokoro>=0.9.4" soundfile
      - run: python tts/gen.py
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: out/
