# Test only: the open military reference sources (tools/probe_milref.mjs) from a GitHub runner. Prints to the log; writes nothing.
name: Probe military reference sources
on:
  push:
    branches: [claude/milref*]
    paths: [tools/probe_milref.mjs, .github/workflows/probe-milref.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node tools/probe_milref.mjs
