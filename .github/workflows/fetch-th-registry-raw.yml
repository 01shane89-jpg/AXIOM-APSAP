# Test only: downloads the public Thai hospital datasets for checking (tools/fetch_th_registry_raw.mjs).
# Commits registry-raw to this working branch only (never main).
name: Fetch Thai hospital registry raw files
on:
  push:
    branches: [claude/hospital-th-raw]
    paths: [tools/fetch_th_registry_raw.mjs, .github/workflows/fetch-th-registry-raw.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/fetch_th_registry_raw.mjs
      - name: Commit the result to this branch
        if: github.ref == 'refs/heads/claude/hospital-th-raw'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry-raw
          git commit -m "Thai registry raw files $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin claude/hospital-th-raw && git push origin HEAD:claude/hospital-th-raw
