# Test only: runs the new feeds of claude/sold-replacements-2 once from a runner and prints what they read. Writes nothing back.
name: Probe traffic hosts
on:
  push:
    branches: [claude/sold-sources-probe]
    paths: [.github/workflows/probe-traffic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: claude/sold-replacements-2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: dense feeds
        run: |
          ONLY=un-sanctions,osm-cables node tools/refresh_dense.mjs 2>&1 | grep -E "un-sanctions|osm-cables" || true
          node -e 'const fs=require("fs");for(const cc of ["ie","gb","de","us","jp","ph","sg","eg","ir","kp"]){const c={};new Function("window",fs.readFileSync("data/live/x/"+cc+".js","utf8"))(c);const X=c.OSAP_XC[cc];const by={};for(const i of X.items)by[i.f]=(by[i.f]||0)+1;console.log("CC",cc,JSON.stringify({un:X.figures["un-sanctions"],cab:by["osm-cables"],tg:by.cables}));const o=X.items.filter(i=>i.f=="osm-cables").slice(0,2);for(const x of o)console.log("CAB",cc,x.t,x.la,x.lo)}'
      - name: knmi rss
        run: curl -s https://cdn.knmi.nl/knmi/xml/rss/rss_KNMIwaarschuwingen.xml | head -c 4000
