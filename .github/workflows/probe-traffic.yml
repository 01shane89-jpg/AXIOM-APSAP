# Test only: checks keyless replacements for sources the sold version drops (tools/probe_sold.mjs). Prints to the log; writes nothing.
name: Probe traffic hosts
on:
  push:
    branches: [claude/sold-sources-probe]
    paths: [tools/probe_sold.mjs, .github/workflows/probe-traffic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/probe_sold.mjs
