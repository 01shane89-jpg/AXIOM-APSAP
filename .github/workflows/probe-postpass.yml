name: Probe postpass (temporary)
on:
  push:
    branches: ["claude/infra-sites-1"]
    paths: [".github/workflows/probe-postpass.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          q="SELECT tags->>'name' AS name, tags->>'aeroway' AS a, geom FROM postpass_pointpolygon WHERE tags->>'aeroway' IN ('aerodrome','heliport') AND geom && ST_MakeEnvelope(97,5,106,21,4326)"
          time curl -sS -m 300 -A "AXIOM-OSAP probe" --data-urlencode "data=$q" https://postpass.geofabrik.de/api/0.2/interpreter -o th.json -w '%{http_code} %{size_download}\n'
          head -c 600 th.json; echo
          q2="SELECT count(*) FROM postpass_pointpolygon WHERE tags->>'waterway'='dam' AND tags ? 'name'"
          time curl -sS -m 300 -A "AXIOM-OSAP probe" --data-urlencode "data=$q2" https://postpass.geofabrik.de/api/0.2/interpreter -w '\n%{http_code}\n'
          q3="SELECT tags->>'name' AS name, geom FROM postpass_pointpolygon WHERE tags->>'waterway'='dam' AND tags ? 'name' AND geom && ST_MakeEnvelope(90,0,120,30,4326)"
          time curl -sS -m 300 -A "AXIOM-OSAP probe" --data-urlencode "data=$q3" https://postpass.geofabrik.de/api/0.2/interpreter -o d.json -w '%{http_code} %{size_download}\n'
          head -c 300 d.json; echo
          time curl -sS -m 60 -o /dev/null -w 'overpass-api.de %{http_code}\n' -A "Mozilla/5.0 AXIOM-OSAP" --data-urlencode 'data=[out:json];node(1);out;' https://overpass-api.de/api/interpreter
          time curl -sS -m 60 -o /dev/null -w 'overpass-api.de with accept %{http_code}\n' -H 'accept: */*' -A "Mozilla/5.0 (X11; Linux x86_64) AXIOM-OSAP infrastructure snapshot (+https://github.com/01shane89-jpg/AXIOM-APSAP)" --data-urlencode 'data=[out:json];node(1);out;' https://overpass-api.de/api/interpreter
