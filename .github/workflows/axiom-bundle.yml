name: AXIOM bundle

# Once a day (tools/axiom_bundle.mjs): the curated records and the live feeds the app already holds, written as one file,
# data/axiom/osap-bundle.ndjson, that AXIOM Analyst Work Station imports offline as discoveries (format and rules in
# tools/axiom_bundle_lib.mjs). Non-commercial sources are left out. Reads only this checkout: no network request, no key.
# On the Netlify site the file needs the Full plan (tools/tiers.mjs). A run on any branch other than main parks its output on
# claude/axiom-bundle-preview-data instead of committing.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiom-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the bundle
        run: node tools/axiom_bundle.mjs
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan axiom-bundle-preview-data
          git rm -rqf --cached .
          git add -f data/axiom
          git commit -qm "Test output (AXIOM bundle) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/axiom-bundle-preview-data
      - name: Commit if anything changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git add -N data/axiom 2>/dev/null || true
          if git diff --quiet -- data/axiom; then echo "no change"; exit 0; fi
          git config user.name "osap-axiom-bundle[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/axiom
          git commit -m "AXIOM bundle $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
