# Test only: opens OSAP headless on the Satellite base maps and zooms past the sharpest imagery (tools/imagery_smoke.mjs).
# Prints to the log and uploads the screenshots in probe-out/ as an artifact; writes nothing to the repo.
name: Probe imagery hosts
on:
  push:
    branches: [claude/sharper-imagery]
    paths: [tools/imagery_smoke.mjs, index.html, .github/workflows/probe-imagery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/imagery_smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: imagery-smoke
          path: probe-out/
