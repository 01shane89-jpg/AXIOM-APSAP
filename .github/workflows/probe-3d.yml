# Test only: opens the 3D terrain view headless with the real network on every base map (tools/probe_3d.mjs).
# Prints tile counts per source to the log and uploads the screenshots in probe-out/; writes nothing to the repo.
name: Probe 3D hosts
on:
  push:
    branches: [claude/3d-buildings-2]
    paths: [tools/probe_3d.mjs, tools/probe_3d_cache.mjs, assets/osap-3d.js, .github/workflows/probe-3d.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium webkit
      - name: 3D after the flat map, live site (Safari and Chrome engines)
        run: node tools/probe_3d_cache.mjs
        continue-on-error: true
        env:
          BASE: https://01shane89-jpg.github.io/AXIOM-APSAP/
      - name: 3D after the flat map, this branch
        run: node tools/probe_3d_cache.mjs
        continue-on-error: true
      - run: node tools/probe_3d.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-3d
          path: probe-out/
