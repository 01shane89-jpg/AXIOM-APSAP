# Test only: checks the free, no-key hosts the Medical plan tool uses (tools/probe_medplan.sh), then opens the plan in a
# headless browser against them (tools/medplan_live.mjs). Prints to the log; writes nothing to the repo.
name: Probe medical plan hosts
on:
  push:
    branches: [claude/medical-plan, claude/medical-plan-poi, claude/medplan-offline]
    paths: [tools/probe_medplan.sh, tools/medplan_live.mjs, assets/osap-medplan.js, .github/workflows/probe-medplan.yml, data/medfac/index.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    # the raw host probe only on demand: run on every push it competes with the live check for Overpass slots
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_medplan.sh
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p medplan-out && OUT=medplan-out node tools/medplan_live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: medplan-live
          path: medplan-out
          retention-days: 7
