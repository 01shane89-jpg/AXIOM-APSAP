# Test only: checks the free, no-key hosts the Medical plan tool uses (tools/probe_medplan.sh), then opens the plan in a
# headless browser against them (tools/medplan_live.mjs). Prints to the log; writes nothing to the repo.
name: Probe medical plan hosts
on:
  push:
    branches: [claude/medical-plan]
    paths: [tools/probe_medplan.sh, tools/medplan_live.mjs, assets/osap-medplan.js, .github/workflows/probe-medplan.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_medplan.sh
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/medplan_live.mjs
