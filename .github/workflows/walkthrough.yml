# Records the sample OSAP walkthrough video (tools/walkthrough.mjs) where the map tiles load, and pushes the .webm to the
# media/walkthrough branch (artifacts cannot be fetched from the build sessions). Writes nothing to main.
name: Record walkthrough video
on:
  push:
    branches: [claude/walkthrough-videos]
    paths: [tools/walkthrough.mjs, .github/workflows/walkthrough.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: OUT=walkthrough node tools/walkthrough.mjs
      - name: Push the video to media/walkthrough
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cp walkthrough/walkthrough.webm pub/ && cd pub
          git init -q -b media/walkthrough
          git -c user.name="github-actions[bot]" -c user.email="41898269+github-actions[bot]@users.noreply.github.com" commit -q --allow-empty -m "walkthrough video from ${GITHUB_SHA::7}" 
          git add walkthrough.webm
          git -c user.name="github-actions[bot]" -c user.email="41898269+github-actions[bot]@users.noreply.github.com" commit -q --amend -m "walkthrough video from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media/walkthrough
