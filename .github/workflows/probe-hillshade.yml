# Test only: fetches sample elevation shading tiles with the real network (tools/probe_hillshade.mjs). Writes nothing to the repo.
name: Probe hillshade tiles
on:
  push:
    branches: [claude/lidar-hillshade]
    paths: [tools/probe_hillshade.mjs, .github/workflows/probe-hillshade.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/probe_hillshade.mjs
