# Test only: checks the free, no-key routing and elevation hosts the Route tab uses, then drives the Route tab headless
# against them (tools/route_smoke.mjs). Prints to the log; writes nothing to the repo.
name: Probe route hosts
on:
  push:
    branches: [claude/route-planning, claude/route-search]
    paths: [tools/probe_route.sh, tools/route_smoke.mjs, assets/osap-route.js, assets/osap-areasum.js, .github/workflows/probe-route.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_route.sh
  route-tab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/route_smoke.mjs
