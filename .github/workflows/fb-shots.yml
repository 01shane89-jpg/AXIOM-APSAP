# Scratch: takes clean feature stills for social posts (tools/fb_shots.mjs) where map tiles load, desktop and phone,
# and pushes the PNGs to media/fb-shots-<view>. Lives only on claude/fb-shots; never merged to main.
name: Feature stills for social posts
on:
  push:
    branches: [claude/fb-shots]
    paths: [tools/fb_shots.mjs, .github/workflows/fb-shots.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        view: [desk, phone]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: VIEW=${{ matrix.view }} OUT=pub node tools/fb_shots.mjs 2>&1 | tee pub-log.txt
      - name: Push the stills
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p pub && cp pub-log.txt pub/log.txt && cd pub
          git init -q -b media/fb-shots-${{ matrix.view }}
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898269+github-actions[bot]@users.noreply.github.com" commit -q -m "feature stills (${{ matrix.view }}) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media/fb-shots-${{ matrix.view }}
