name: Probe GNSS fields (temporary)
on:
  push:
    branches: [claude/gps-jamming]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const pts=[[55,20],[34,34],[45,35],[52,13]];
          const S={fi:(a,b)=>`https://opendata.adsb.fi/api/v3/lat/${a}/lon/${b}/dist/250`,lol:(a,b)=>`https://api.adsb.lol/v2/point/${a}/${b}/250`};
          for(const [k,u] of Object.entries(S)){for(const [a,b] of pts){
            try{const r=await fetch(u(a,b),{headers:{"User-Agent":"AXIOM-OSAP/1.0 probe"}});const j=await r.json();const ac=j.ac||j.aircraft||[];
            const keys={};for(const x of ac)for(const f of Object.keys(x))keys[f]=(keys[f]||0)+1;
            const bad=ac.filter(x=>typeof x.nac_p==="number"&&(x.nac_p<8||x.nic<7)).length;
            const gok=ac.filter(x=>x.gpsOkBefore!=null).length;
            console.log(k,a,b,"status",r.status,"n",ac.length,"bad",bad,"gpsOkBefore",gok,JSON.stringify(keys));
            const ex=ac.find(x=>x.gpsOkBefore!=null)||ac.find(x=>x.nac_p!=null&&x.nac_p<8)||ac[0];console.log("EX",JSON.stringify(ex));
            }catch(e){console.log(k,a,b,"ERR",e.message)}
            await new Promise(r=>setTimeout(r,k==="lol"?6000:1500));}}
          JS
          node p.mjs
