# Builds the AXIOM OSAP Android app for Google Play (android/README.md) on a free GitHub runner, which has the Android SDK.
# The app is a Trusted Web Activity of the live site, so it only needs building when android/ changes.
# - Pull request touching android/: generates the project and builds the release bundle (.aab), kept as a run artifact.
# - Run workflow (Actions tab) with a version such as 0.1.0 and a version code (must go up by one or more every upload).
# The bundle comes out UNSIGNED: the upload key never lives in GitHub. It is signed with the upload key off GitHub
# (android/README.md, "Sign and upload") before it goes to Play Console.
name: Android app
on:
  pull_request:
    paths: ["android/**", ".well-known/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.1.0"
        required: false
        default: "0.1.0"
      code:
        description: "Version code, a whole number higher than the last upload to Play"
        required: false
        default: "1"
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the site link file names this app
        working-directory: .
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("android/twa-manifest.json")).packageId;
            const links = JSON.parse(fs.readFileSync(".well-known/assetlinks.json"));
            const hit = links.find((l) => l.target && l.target.package_name === pkg);
            if (!hit) { console.error("::error::.well-known/assetlinks.json has no entry for " + pkg); process.exit(1); }
            const bad = hit.target.sha256_cert_fingerprints.filter((f) => !/^([0-9A-F]{2}:){31}[0-9A-F]{2}$/.test(f));
            if (bad.length) { console.error("::error::bad fingerprint(s): " + bad.join(", ")); process.exit(1); }
            console.log("assetlinks ok: " + pkg + ", " + hit.target.sha256_cert_fingerprints.length + " key(s)");'
      - run: npm ci --no-audit --no-fund
      - name: Generate the Android project
        env:
          V: ${{ inputs.version || '0.1.0' }}
          C: ${{ inputs.code || '1' }}
        run: node generate.mjs "$V" "$C"
      - name: Build the release bundle (unsigned)
        working-directory: android/project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
          ls -l app/build/outputs/bundle/release/ app/build/outputs/apk/debug/
      - name: Check the bundle
        working-directory: android/project
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$aab" | grep -q "base/manifest/AndroidManifest.xml" || { echo "::error::bundle has no manifest"; exit 1; }
          echo "::notice title=Android bundle::$(du -h "$aab" | cut -f1) $(sha256sum "$aab" | cut -c1-16)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osap-android-${{ inputs.version || 'pr' }}
          path: |
            android/project/app/build/outputs/bundle/release/app-release.aab
            android/project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
