# Thailand–Malaysia border line and the roads that cross it, from OpenStreetMap (tools/fetch_osm_th_my_border.mjs ->
# source/thailand/osm-th-my-border.json), for the Deep South border map. Manual (or a push of the fetcher on a border branch):
# the result is a source file reviewed before tools/build_deepsouth_border.mjs is re-run. Commits on the branch it runs on.
name: Refresh Deep South border roads (OSM)

on:
  push:
    branches: ["claude/ds-border-roads*"]
    paths: ["tools/fetch_osm_th_my_border.mjs", ".github/workflows/refresh-dsb-osm.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dsb-osm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/fetch_osm_th_my_border.mjs
      - name: Commit
        run: |
          git add source/thailand/osm-th-my-border.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh Thailand–Malaysia border roads from OpenStreetMap $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
