name: Refresh conflict tabs

# Every hour: the conflict tabs (tools/conflicts.json): each listed conflict's reports (the news step's items plus the
# conflict's own feeds and news searches), UCDP events, and front-line or control layers, versioned when they change, then
# the conflict extras (tools/conflict_extras/). Kept out of the 15-minute refresh (refresh-flood.yml) so that one stays short.
# Large files (UCDP monthly files, the DeepStateMap file) are downloaded again only when the server says they changed.
on:
  schedule:
    # Off the hour and quarter-hour, when GitHub delays scheduled runs most. Free while the repository is public.
    - cron: "44 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "conflicts (default) or probe-conflicts (diagnostic, writes probe-out/ only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-conflicts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Headline translation with the same MADLAD-400 model as the 15-minute refresh, from the same Actions cache. If the
      # cache is empty (the 15-minute refresh fills it), reports keep their original-language titles until the next run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the translation model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/osap-mt
          key: madlad400-3b-mt-ct2-int8-v1
      - name: Install the translation runtime
        run: python -m pip install --quiet "ctranslate2>=4,<5" sentencepiece
        continue-on-error: true
      - name: Refresh the conflict tabs
        if: ${{ inputs.only != 'probe-conflicts' }}
        run: node tools/refresh_conflicts.mjs
        timeout-minutes: 18
        continue-on-error: true
      # Data that is not a report, such as air-raid alert states, satellite heat detections and each side's running claims.
      # Reads the front files written above.
      - name: Refresh the conflict extras
        if: ${{ inputs.only != 'probe-conflicts' }}
        run: node tools/conflict_extras.mjs
        timeout-minutes: 4
        continue-on-error: true
      - name: Probe the conflict sources (diagnostic, writes probe-out/ only)
        if: ${{ inputs.only == 'probe-conflicts' }}
        run: PROBE=1 node tools/refresh_conflicts.mjs; node tools/probe_wikimaps.mjs
        continue-on-error: true
      # A test run on a feature branch parks its output on a throwaway branch (never on the feature branch or main).
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan conflicts-preview-data
          git rm -rqf --cached .
          for p in data/live/conflicts probe-out; do git add -f "$p" 2>/dev/null || true; done
          git commit -qm "Test output (${{ inputs.only || 'conflicts' }}) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/dense-preview-data-${{ inputs.only || 'conflicts' }}
        continue-on-error: true
      # Only main commits snapshots. The 15-minute refresh commits to main too, so rebase onto it and retry.
      - name: Commit if the conflict data changed
        if: ${{ github.ref == 'refs/heads/main' && inputs.only != 'probe-conflicts' }}
        run: |
          git add -N data/live/conflicts
          if git diff --quiet -- data/live/conflicts; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/conflicts
          git commit -m "Refresh conflict tabs $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 7; done
          exit 1
