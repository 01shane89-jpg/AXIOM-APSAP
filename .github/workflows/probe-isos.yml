# Test only: prints the public International SOS and TRICARE Overseas contact pages (tools/probe_isos.sh) so the Medical
# plan can quote their published numbers with a source. Writes nothing.
name: Probe ISOS and TRICARE Overseas contacts
on:
  push:
    branches: ["claude/medplan-*"]
    paths: [tools/probe_isos.sh, .github/workflows/probe-isos.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_isos.sh
