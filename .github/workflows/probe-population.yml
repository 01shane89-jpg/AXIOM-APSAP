# Test only: looks for keyless worldwide population-density tile services (tools/probe_population.sh). Prints to the log.
name: Probe population tiles
on:
  push:
    branches: [claude/population-density]
    paths: [tools/probe_population.sh, .github/workflows/probe-population.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tools/probe_population.sh
