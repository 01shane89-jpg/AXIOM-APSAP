# Hospitals' published phone numbers for the Medical plan (tools/read_hospital_phones.mjs, then
# tools/build_hospital_phones.mjs -> data/hospitals/<cc>/phones.json): embassy hospital lists, each hospital's own website
# (home and contact pages, robots.txt obeyed) and Wikidata. Institutional numbers only. Monthly; it commits on the branch it
# runs on (main on schedule). Hospital pages are read here on GitHub Actions only, never from anywhere else.
name: Refresh hospital phone numbers

on:
  schedule:
    - cron: "17 5 10 * *"
  workflow_dispatch:
    inputs:
      cc:
        description: Country code
        default: th

permissions:
  contents: write

concurrency:
  group: refresh-hospital-phones-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: command -v pdftotext || (sudo apt-get update -q && sudo apt-get install -yq poppler-utils)
      - name: Read
        run: node tools/read_hospital_phones.mjs "${CC:-th}" "$RUNNER_TEMP/phones"
        env:
          CC: ${{ github.event.inputs.cc }}
      - name: Build
        run: node tools/build_hospital_phones.mjs "$RUNNER_TEMP/phones" "${CC:-th}"
        env:
          CC: ${{ github.event.inputs.cc }}
      - name: Commit
        run: |
          git add -A data/hospitals/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "asap-flood-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh hospital phone numbers $(date -u +'%Y-%m-%d %H:%MZ')"
          b="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "$b" && git push -q origin "HEAD:$b" && exit 0; sleep 7; done
          exit 1
