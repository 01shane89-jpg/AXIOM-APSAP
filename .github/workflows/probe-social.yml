# Test only: checks candidate Telegram, Bluesky and Mastodon accounts (tools/social_candidates.json) and lists accounts on
# government-run servers. Prints one line per account and uploads probe-out/social.json. Writes nothing to the repo.
name: Probe social accounts
on:
  push:
    branches: [claude/social-probe]
    paths: [tools/social_candidates.json, tools/probe_social.mjs, .github/workflows/probe-social.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node tools/probe_social.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: social-probe
          path: probe-out/social.json
