name: Refresh military reference

# Once a week (tools/refresh_milref.mjs): each country's armed forces, units, equipment and military installations as recorded
# on Wikidata (CC0), and military spending, personnel and arms transfers from the World Bank (CC BY 4.0; SIPRI and IISS series),
# into data/live/milref/<cc>.json and data/live/milref/index.json. Every record is a source claim with a fingerprint; the app's
# country brief shows them (assets/osap-milref.js). Keyless, no account. A run on any branch other than main parks its output on
# claude/milref-preview-data instead of committing.
on:
  schedule:
    - cron: "41 4 * * 0"
  push:
    branches: [claude/milref*]
    paths: [tools/refresh_milref.mjs, tools/milref_lib.mjs, .github/workflows/refresh-milref.yml]
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated country codes to read (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-milref-${{ github.ref }}
  cancel-in-progress: false

jobs:
  milref:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Read forces, equipment, installations and military figures
        timeout-minutes: 52
        run: node tools/refresh_milref.mjs
        env:
          MILREF_ONLY: ${{ github.event.inputs.only }}
          MILREF_BUDGET_MIN: "45"
      - name: Park test output on a preview-data branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan milref-preview-data
          git rm -rqf --cached .
          git add -f data/live/milref
          git commit -qm "Test output (milref) $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -qf origin HEAD:refs/heads/claude/milref-preview-data
      # sold version only (tools/nc_strip.mjs): with the repository variable OSAP_COMMERCIAL set to true, non-commercial
      # sources are taken out of the files before they are committed
      - name: Strip non-commercial sources (sold version only)
        if: ${{ vars.OSAP_COMMERCIAL == 'true' }}
        run: node tools/nc_strip.mjs data/live/milref
      - name: Commit if anything changed
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          node tools/seal_hidden.mjs  # hidden areas (tools/hidden-areas.json) are sealed before anything is committed
          git add -N data/live/milref 2>/dev/null || true
          if git diff --quiet -- data/live/milref; then echo "no change"; exit 0; fi
          git config user.name "asap-milref-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/milref
          git commit -m "Refresh military reference $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
