name: Keep the 15-minute refresh running

# GitHub runs scheduled workflows late or skips them when it is busy (the 15-minute cron in refresh-flood.yml has been firing
# only about every 3 hours). This job starts both lanes of "Refresh live snapshots" on main every 15 minutes itself, for about 5 h 30 min (under
# GitHub's 6-hour job limit), then starts a fresh copy of itself so the chain carries on. The hourly schedule below restarts
# the chain if it ever breaks. Only one keeper runs at a time: a new copy waits in the queue until the current one ends
# (GitHub keeps at most one waiting), so the hand-over and the hourly restart never double up.
# Each round also checks the published data's health (tools/health.mjs watch) and posts to the OSAP health channel on ntfy.sh
# when data has stopped arriving or a key feed has died, and once more when it recovers.
# Free while the repository is public (standard GitHub-hosted runners cost nothing for public repositories).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Start the refresh every 15 minutes for about 5 h 30 min
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while :; do
            # two lanes, each in its own queue: "fast" (weather, hazards, quick feeds; about 10 minutes) and "news" (news, data sets,
            # Deep South, social, summaries; about 20). Skip a lane's round while one of its runs is still waiting, so rounds never pile up.
            for lane in fast news; do
              waiting=$(( $(gh run list --workflow refresh-flood.yml --branch main --status queued --json displayTitle --jq "[.[]|select(.displayTitle|endswith(\"($lane)\"))]|length" || echo 0) + $(gh run list --workflow refresh-flood.yml --branch main --status pending --json displayTitle --jq "[.[]|select(.displayTitle|endswith(\"($lane)\"))]|length" || echo 0) ))
              if [ "$waiting" = "0" ]; then
                gh workflow run refresh-flood.yml --ref main -f lane=$lane && echo "$(date -u +%H:%MZ) started the $lane refresh" || echo "$(date -u +%H:%MZ) could not start the $lane refresh"
              else
                echo "$(date -u +%H:%MZ) a $lane refresh is still queued; skipping this round"
              fi
            done
            # the conflict tabs (refresh-conflicts.yml) every fourth round, about once an hour, unless one is still waiting.
            # Only runs from the last 2 hours count: GitHub can leave a ghost run "queued" for good (one from 7 Oct never
            # started and can't be cancelled), and counting it stopped every hourly start until the feed went stale.
            round=$(( ${round:-0} + 1 ))
            if [ $(( round % 4 )) = 1 ]; then
              since=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
              cw=$(( $(gh run list --workflow refresh-conflicts.yml --branch main --status queued --json createdAt --jq "[.[]|select(.createdAt > \"$since\")]|length" || echo 0) + $(gh run list --workflow refresh-conflicts.yml --branch main --status in_progress --json createdAt --jq "[.[]|select(.createdAt > \"$since\")]|length" || echo 0) ))
              if [ "$cw" = "0" ]; then
                gh workflow run refresh-conflicts.yml --ref main && echo "$(date -u +%H:%MZ) started the conflict refresh" || echo "$(date -u +%H:%MZ) could not start the conflict refresh"
              else
                echo "$(date -u +%H:%MZ) a conflict refresh is still waiting or running; skipping this round"
              fi
            fi
            # the 3-hourly AI drafts (refresh-ai.yml: incident summaries, OSIR sections, record suggestions). Its "53 */3" schedule started
            # 5 runs (1 cancelled) of the 8 due in the 24 h to 24 Oct 2026 18:53Z, so OSIR drafts went 6 h and more between rounds. When no run of it has been
            # created in the last 3 h 20 min, start the same round by hand (task=cycle). Only recent runs count, as for the conflict tabs.
            since=$(date -u -d '200 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            aw=$(gh run list --workflow refresh-ai.yml --branch main --limit 20 --json createdAt --jq "[.[]|select(.createdAt > \"$since\")]|length" || echo 1)
            if [ "$aw" = "0" ]; then
              gh workflow run refresh-ai.yml --ref main -f task=cycle && echo "$(date -u +%H:%MZ) started the AI drafts round" || echo "$(date -u +%H:%MZ) could not start the AI drafts round"
            fi
            # the daily AI pass (refresh-ai.yml task=daily, due on its 01:23Z schedule after the news lane has built the day's rules
            # summaries). GitHub skipped that schedule on 25 Oct 2026, leaving every country's daily summary rules-only. From 02:30Z, when
            # no daily (or both) run of it has been created today, start one by hand; at most one a day, so a failed pass is not retried.
            # A cancelled one does not count: the workflow keeps one run waiting, so a later run cancels a waiting daily pass.
            if [ "$(date -u +%H%M)" -ge 0230 ]; then
              today=$(date -u +%Y-%m-%dT00:00:00Z)
              dw=$(gh run list --workflow refresh-ai.yml --branch main --limit 30 --json createdAt,displayTitle,conclusion --jq "[.[]|select(.createdAt > \"$today\" and .conclusion != \"cancelled\" and (.displayTitle|test(\"[(](daily|both)[)]\")))]|length" || echo 1)
              if [ "$dw" = "0" ]; then
                gh workflow run refresh-ai.yml --ref main -f task=daily && echo "$(date -u +%H:%MZ) started the daily AI pass" || echo "$(date -u +%H:%MZ) could not start the daily AI pass"
              fi
            fi
            # data health: alert on the ntfy health channel when the published data has stopped (never fails the keeper)
            timeout 90 node tools/health.mjs watch || echo "$(date -u +%H:%MZ) health check did not finish"
            [ $(( $(date +%s) + 900 )) -lt "$end" ] || break
            sleep 900
          done
      - name: Hand over to a fresh keeper
        if: ${{ !cancelled() }}
        run: gh workflow run refresh-keeper.yml --ref main
