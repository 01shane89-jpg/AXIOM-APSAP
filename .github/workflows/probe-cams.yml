# Test only: checks the official, keyless traffic camera feeds from a GitHub runner. Prints to the log; writes nothing.
name: Probe traffic cameras
on:
  push:
    branches: [claude/traffic-cameras]
    paths: [tools/probe_cams_raw.mjs, .github/workflows/probe-cams.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/probe_cams_raw.mjs
